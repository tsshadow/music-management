[versions]
# Drives the `wrapper` task in build.gradle, so it has to match
# gradle/wrapper/gradle-wrapper.properties below -- the two had drifted
# (8.11.1 here against 8.14.5 there), which meant running `./gradlew wrapper`
# would quietly downgrade the wrapper.
gradle                 = "9.7.1"

appMinSdk = "33"
appTargetSdk = "35"
# Deliberately ahead of appTargetSdk. compileSdk decides which APIs the code may
# reference; targetSdk decides which runtime behaviours Android applies on a
# user's device, and raising that is a change to verify on a device rather than
# a side effect of a dependency bump.
#
# The androidx libraries drive this number, four at a time: activity 1.13 and
# fifteen siblings refused to be consumed below 36, then core 1.19 and three
# others refused below 37. `checkDebugAarMetadata` reports the whole batch at
# once, which reads as a broken build rather than one number being too low.
#
# 37 is also why the Gradle and AGP majors in this file are not optional:
# AGP 8.13 caps compileSdk at 36, and AGP 9 needs Gradle 9. None of the three
# can move on its own.
appCompileSdk = "37"

gson                   = "2.14.0"
kotlinxSerializationJson = "1.11.0"
lifecycleLivedataKtx   = "2.11.0"
media                  = "1.8.0"
credentials            = "1.6.0"
googleid               = "1.2.1"
security               = "1.1.0"
gradlePlugin           = "9.4.1"
androidxcar            = "1.7.0"
appcompat              = "1.8.0"
activity               = "1.13.0"
androidxcore           = "1.19.0"
ktlintGradle           = "14.2.0"
detekt                 = "1.23.8"
documentFile           = "1.1.0"
preferences            = "1.2.1"
media3                 = "1.11.1"
# Capacitor 9 does not exist as a release: npm carries 9.0.0-alpha.6 under the `next`
# tag and Maven Central has nothing above 8.5.2 for com.capacitorjs:core. 8.5.2 is the
# current stable, and the web side must install @capacitor/core and @capacitor/cli at the
# same version -- the bridge and the JS runtime are one artefact split in two.
capacitor              = "8.5.2"

materialDesign         = "1.14.0"
room                   = "2.8.5"
kotlin                 = "2.4.20"
ksp                    = "2.3.12"
kotlinxCoroutines      = "1.11.0"
viewModelKtx           = "2.11.0"

retrofit               = "3.0.0"
jackson                = "2.22.2"
okhttp                 = "5.5.0"
koin                   = "4.2.2"
picasso               = "2.71828"

junit4                 = "4.13.2"
junit5                 = "6.1.3"
junitPlatform          = "6.1.3"
mockito                = "5.23.0"
mockitoKotlin          = "6.3.0"
mockk                  = "1.14.11"
kluent                 = "1.73"
archunit               = "1.5.0"
apacheCodecs           = "1.22.1"
robolectric            = "4.17"
timber                 = "5.0.1"
jacoco                 = "0.8.15"
colorPicker            = "2.4.0"
rxJava                 = "3.1.12"
rxAndroid              = "3.0.2"

