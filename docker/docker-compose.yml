  firefox:
    security_opt:
      - no-new-privileges:true
    # Only a PID ceiling here: the image's s6-overlay init needs root, writes
    # all over its own filesystem and switches users, so capabilities and a
    # read-only root are a follow-up that needs the YouTube re-login tried
    # against it. 326 PIDs on production (a browser is many threads).
    pids_limit: 2048
    image: jlesage/firefox:v26.09.1@sha256:302aa068dcfa46a2d248771c998f67377383554df8940252caef42b99c13eb65
    container_name: muma-firefox
    labels:
      # Never updated by Watchtower: music-manager, the database and the tools change only through a deploy (issue #68).
      com.centurylinklabs.watchtower.enable: "false"
    logging: *default-logging
    restart: unless-stopped
    # Measured 626 MiB (2026-09-25). /dev/shm is a 1 GB tmpfs (shm_size above) and
    # tmpfs pages are charged to the container's memory cgroup, so a limit below
    # shm_size plus the browser itself could OOM-kill Firefox while the shared
    # memory is full -- during the YouTube re-login, the one moment it is needed.
    # 2g covers a full /dev/shm and a peak browser. Override with
    # MUMA_MEM_LIMIT_FIREFOX.
    mem_limit: ${MUMA_MEM_LIMIT_FIREFOX:-2g}
    shm_size: "1gb"
    environment:
      TZ: Europe/Amsterdam
      WEB_AUTHENTICATION: "1"
      SECURE_CONNECTION: "1"
      DISABLE_GPU: "1"
      WEB_AUTHENTICATION_USERNAME: ${FIREFOX_USER:-admin}
      # No default: it was "admin", on a port bound on every interface.
      # scripts/ci/check-required-secrets.sh refuses a release whose
      # PROD_ENV_FILE does not set it.
      WEB_AUTHENTICATION_PASSWORD: ${FIREFOX_PASSWORD}
    ports:
      - "7003:5800"
    volumes:
      - ${HOST_DATA_PATH}/firefox:/config
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

networks:
  music-management_db:
    name: music-management_db
    driver: bridge
