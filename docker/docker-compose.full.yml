  importer_worker:
    # Opt-in source worker: runs only when this profile is enabled (COMPOSE_PROFILES,
    # docs/self-hosting.md#source-workers-are-compose-profiles).
    profiles: ["importer"]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_IMPORTER}:latest
    container_name: muma-importer-worker
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/importer/importer_service.py",
        "--repeat",
        "--sleeptime",
        "300"
      ]
    environment:
      PYTHONPATH: /app:/app/services/downloader
      debug: "${debug}"
      dryrun: "False"
      rescan: "True"
      delimiter: "${delimiter}"
      import_folder_path: ${import_folder_path}
      eps_folder_path: ${eps_folder_path}
      music_folder_path: ${music_folder_path}
      youtube_folder: ${youtube_folder}
      youtube_video_folder: ${youtube_video_folder}
      youtube_archive: ${youtube_archive}
      youtube_accounts: ${youtube_accounts}
      soundcloud_folder: ${soundcloud_folder}
      soundcloud_archive: ${soundcloud_archive}
      soundcloud_accounts: ${soundcloud_accounts}
      ffmpeg_location: /usr/local/bin
      ffmpeg-location: /usr/local/bin
      telegram_folder: ${telegram_folder}
      ytdlp: yt-dlp
      telegram_api_id: "${telegram_api_id}"
      telegram_api_hash: "${telegram_api_hash}"
      telegram_session: ${telegram_session}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
      ask-for-missing: "false"
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

  youtube_worker:
    profiles: ["youtube"]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_DOWNLOADER}:latest
    container_name: muma-youtube-worker
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "youtube",
        "--repeat",
        "--break-on-existing"
      ]
    environment:
      PYTHONPATH: /app:/app/services/downloader
      debug: "${debug}"
      dryrun: "False"
      rescan: "True"
      delimiter: "${delimiter}"
      import_folder_path: ${import_folder_path}
      eps_folder_path: ${eps_folder_path}
      music_folder_path: ${music_folder_path}
      youtube_folder: ${youtube_folder}
      youtube_video_folder: ${youtube_video_folder}
      youtube_archive: ${youtube_archive}
      youtube_accounts: ${youtube_accounts}
      soundcloud_folder: ${soundcloud_folder}
      soundcloud_archive: ${soundcloud_archive}
      soundcloud_accounts: ${soundcloud_accounts}
      ffmpeg_location: /usr/local/bin
      ffmpeg-location: /usr/local/bin
      telegram_folder: ${telegram_folder}
      ytdlp: yt-dlp
      telegram_api_id: "${telegram_api_id}"
      telegram_api_hash: "${telegram_api_hash}"
      telegram_session: ${telegram_session}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
      ask-for-missing: "false"
      YT_COOKIES: "firefox:/firefox-config/profile"
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
      - ${HOST_DATA_PATH}/firefox:/firefox-config:ro
    networks:
      - music-management_db

  soundcloud_worker:
    profiles: ["soundcloud"]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_DOWNLOADER}:latest
    container_name: muma-soundcloud-worker
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "soundcloud",
        "--repeat",
        "--break-on-existing"
      ]
    environment:
      PYTHONPATH: /app:/app/services/downloader
      debug: "${debug}"
      dryrun: "False"
      rescan: "True"
      delimiter: "${delimiter}"
      import_folder_path: ${import_folder_path}
      eps_folder_path: ${eps_folder_path}
      music_folder_path: ${music_folder_path}
      youtube_folder: ${youtube_folder}
      youtube_video_folder: ${youtube_video_folder}
      youtube_archive: ${youtube_archive}
      youtube_accounts: ${youtube_accounts}
      soundcloud_folder: ${soundcloud_folder}
      soundcloud_archive: ${soundcloud_archive}
      soundcloud_accounts: ${soundcloud_accounts}
      ffmpeg_location: /usr/local/bin
      ffmpeg-location: /usr/local/bin
      telegram_folder: ${telegram_folder}
      ytdlp: yt-dlp
      telegram_api_id: "${telegram_api_id}"
      telegram_api_hash: "${telegram_api_hash}"
      telegram_session: ${telegram_session}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
      ask-for-missing: "false"
      soundcloud_cookies: "firefox:/firefox-config/profile"
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
      - ${HOST_DATA_PATH}/firefox:/firefox-config:ro
    networks:
      - music-management_db

  telegram_worker:
    profiles: ["telegram"]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TELEGRAM}:latest
    container_name: muma-telegram-worker
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "telegram",
        "--repeat",
      ]
    environment:
      PYTHONPATH: /app:/app/services/downloader
      debug: "${debug}"
      dryrun: "False"
      delimiter: "${delimiter}"
      music_folder_path: ${music_folder_path}
      telegram_folder: ${telegram_folder}
      telegram_api_id: "${telegram_api_id}"
      telegram_api_hash: "${telegram_api_hash}"
      telegram_session: ${telegram_session}
      telegram_accounts: "${telegram_accounts}" 
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db  
    stdin_open: true
    tty: true

  tagger_worker:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TAGGER}:latest
    container_name: muma-tagger-worker
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/tagger/tagger_service.py",
        "--repeat",
        "--sleeptime",
        "300"
      ]
    environment:
      PYTHONPATH: /app:/app/services/downloader
      debug: "${debug}"
      delimiter: "${delimiter}"
      import_folder_path: ${import_folder_path}
      eps_folder_path: ${eps_folder_path}
      music_folder_path: ${music_folder_path}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

  scanner_service:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_SCANNER}:latest
    container_name: muma-scanner
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/scanner/scanner_service.py",
        "--repeat",
        "--sleeptime",
        "3600"
      ]
    environment:
      PYTHONPATH: /app:/app/services/downloader
      debug: "${debug}"
      delimiter: "${delimiter}"
      music_folder_path: ${music_folder_path}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
    volumes:
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

  soundcloud-fetcher:
    profiles: ["soundcloud"]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TOOLS}:latest
    container_name: muma-soundcloud-fetcher
    depends_on:
      - db
    command: ["python", "tools/soundcloud_fetcher.py"]
    environment:
      - PYTHONPATH=/app:/app/services/downloader
      - DB_HOST=${DB_HOST}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_DB=${DB_DB}
      - music_folder_path=${music_folder_path}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

  genre-processor:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TOOLS}:latest
    container_name: genre-processor
    depends_on:
      - db
    environment:
      - DB_HOST=${DB_HOST}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_DB=${DB_DB}
    stdin_open: true
    tty: true
    networks:
      - music-management_db

  # Deprecated and disabled since 2026-09-25, kept commented: see services/ml-analyzer/DEPRECATED.md
#  ml-analyzer:
#    security_opt:
#      - no-new-privileges:true
#    image: ${DOCKER_USER}/${IMAGE_ML}:latest
#    container_name: muma-ml-analyzer
#    depends_on:
#      - db
#    environment:
#      - DB_HOST=${DB_HOST}
#      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
#      - DB_PORT=${DB_PORT}
#      - DB_USER=${DB_USER}
#      - DB_PASS=${DB_PASS}
#      - DB_DB=${DB_DB}
#      - PYTHONPATH=/app
#    volumes:
#      - ${HOST_MUSIC_PATH}:/mnt/music
#      - ${HOST_DATA_PATH}/shared:/shared
#    networks:
#      - music-management_db

  firefox:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: jlesage/firefox:v26.09.1@sha256:302aa068dcfa46a2d248771c998f67377383554df8940252caef42b99c13eb65
    container_name: muma-firefox
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      TZ: Europe/Amsterdam
      WEB_AUTHENTICATION: "1"
      SECURE_CONNECTION: "1"
      DISABLE_GPU: "1"
      WEB_AUTHENTICATION_USERNAME: ${FIREFOX_USER:-admin}
      # No default: it was "admin", on a port bound on every interface.
      WEB_AUTHENTICATION_PASSWORD: ${FIREFOX_PASSWORD}
    ports:
      - "7003:5800"
    volumes:
      - ${HOST_DATA_PATH}/firefox:/config
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

networks:
  music-management_db:
    name: music-management_db
    driver: bridge
