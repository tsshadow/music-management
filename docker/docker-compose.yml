  soundcloud-fetcher:
    profiles: ["soundcloud"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: *root-file-caps
    pids_limit: 512
    image: ${DOCKER_USER}/${IMAGE_TOOLS}:${IMAGE_TAG:-latest}
    container_name: muma-soundcloud-fetcher
    labels:
      # Never updated by Watchtower: music-manager, the database and the tools change only through a deploy (issue #68).
      com.centurylinklabs.watchtower.enable: "false"
    logging: *default-logging
    # One-shot: runs when started by hand or by a DEPLOY_ONESHOTS=1 deploy,
    # never on a routine deploy (scripts/deploy.sh leaves it alone).
    restart: "no"
    # One-shot Python job against the database (soundcloud-fetcher also runs
    # yt-dlp). Not running when measured on 2026-09-25; 1g is half the ceiling of
    # the downloader worker, which does the same work continuously. Override with
    # MUMA_MEM_LIMIT_ONESHOT.
    mem_limit: ${MUMA_MEM_LIMIT_ONESHOT:-1g}
    depends_on:
      - db
    command: ["python", "tools/soundcloud_fetcher.py"]
    environment:
      <<: [*environment-db]
      NOTIFY_URL: ${NOTIFY_URL}
      PYTHONPATH: /app
      music_folder_path: ${music_folder_path}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

  genre-processor:
    security_opt:
