apply from: "${project.rootDir}/gradle_scripts/code_quality.gradle"

android {
    def signingProperties = new Properties()
    def envFile = rootProject.file(".env")
    if (envFile.exists()) {
        envFile.withInputStream { signingProperties.load(it) }
    }
    // Fallback to local.properties if it still exists (e.g. created by IDE)
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { signingProperties.load(it) }
    }

    def envOrProp = { String key, String defVal = null ->
        return System.getenv(key) ?: signingProperties.getProperty(key, defVal)
    }

    // The server address, the Google OAuth Web client id, an optional own MuMa API host and the
    // owner's domain are build settings: a Gradle property (muma.serverUrl, muma.googleClientId,
    // muma.apiUrl, muma.ownDomain, e.g. in ~/.gradle/gradle.properties) or the environment
    // (MUMA_SERVER_URL, MUMA_GOOGLE_CLIENT_ID, MUMA_API_URL, MUMA_OWN_DOMAIN). Prefer those over -P on the command line, where the value shows in `ps`
    // (bug report 125). Without them: https://music.example.org and no Google button. Values are
    // validated, so none can break the generated Java string. A release build refuses the
    // defaults (checkMumaReleaseConfig below).
    def mumaConfig = { String property, String envName, String defVal, String pattern ->
        def raw = project.findProperty(property) ?: envOrProp(envName)
        def value = (raw == null || raw.toString().trim().isEmpty()) ? defVal : raw.toString().trim()
        if (!(value ==~ pattern)) {
            throw new GradleException("${property} / ${envName} has an invalid value (allowed: ${pattern})")
        }
        return value
    }
    def urlPattern = /(https?:\/\/[A-Za-z0-9.\-]+(:[0-9]+)?(\/[A-Za-z0-9._~\-\/]*)?)?/
    def mumaDefaultServer = 'https://music.example.org'
    def mumaServerUrl = mumaConfig('muma.serverUrl', 'MUMA_SERVER_URL', mumaDefaultServer, urlPattern)
    def mumaApiUrl = mumaConfig('muma.apiUrl', 'MUMA_API_URL', '', urlPattern)
    def mumaOwnDomain = mumaConfig('muma.ownDomain', 'MUMA_OWN_DOMAIN', '', /[A-Za-z0-9.\-]*/)
    def mumaGoogleClientId = mumaConfig('muma.googleClientId', 'MUMA_GOOGLE_CLIENT_ID', '', /[A-Za-z0-9._\-]*/)

    tasks.register("checkMumaReleaseConfig") {
        description = "Fails a release build that would ship the example server or no Google client id."
        def allowDefaults = (project.findProperty('muma.allowDefaults') ?: System.getenv('MUMA_ALLOW_DEFAULTS')) == 'true'
        def server = mumaServerUrl
        def clientId = mumaGoogleClientId
        doLast {
            if (!allowDefaults && (server == mumaDefaultServer || clientId.isEmpty())) {
                throw new GradleException(
                    "A release build needs MUMA_SERVER_URL (not the example default) and " +
                        "MUMA_GOOGLE_CLIENT_ID. Set muma.allowDefaults=true only for a build that is never shipped.")
            }
        }
    }
    tasks.matching { it.name ==~ /(assemble|bundle|package)Release/ }.configureEach {
        dependsOn "checkMumaReleaseConfig"
    }

    compileSdk = libs.versions.appCompileSdk.get().toInteger()

    defaultConfig {
        applicationId = 'nl.teunschriks.mumamobile'
        versionCode 370
        versionName "7.19.0"

        minSdk = libs.versions.appMinSdk.get().toInteger()
        targetSdk = libs.versions.appTargetSdk.get().toInteger()
        resourceConfigurations += ['cs', 'de', 'en', 'es', 'fr', 'gl', 'hu', 'it', 'ja', 'nb-rNO', 'nl', 'nl-rBQ', 'nl-rCW', 'pl', 'pt', 'pt-rBR', 'ru', 'zh-rCN', 'zh-rTW']

        buildConfigField "String", "APK_HOST_URL", "\"${envOrProp('APK_HOSTER_URL', 'https://apk.example.org')}\""
        // No apk-hoster credential goes into BuildConfig: the update check asks as the hoster's
        // public read-only 'guest' account (AppUpdate.versionUrl). APK_HOSTER_PASSWORD is the
        // upload password and is only read by scripts/deploy.sh, never compiled in (bug report 054).
        // The server and the sign-in client are not in the source: see mumaConfig above.
        buildConfigField "String", "MUMA_SERVER_URL", "\"${mumaServerUrl}\""
        buildConfigField "String", "MUMA_API_URL", "\"${mumaApiUrl}\""
        buildConfigField "String", "MUMA_OWN_DOMAIN", "\"${mumaOwnDomain}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${mumaGoogleClientId}\""
    }

    def getServerJson = { boolean includePassword ->
        def serverEnvFile = rootProject.file(".server-env.json")
        if (!serverEnvFile.exists()) return "[]"
        
        def content = serverEnvFile.text
        if (!includePassword) {
            // Remove password field from JSON
            content = content.replaceAll(/"password"\s*:\s*"[^"]*"\s*,?/, '')
            // Clean up trailing commas if any
            content = content.replaceAll(/,\s*\}/, '}')
        }
        
        return content
            .replaceAll('\r?\n', '')
            .replaceAll('\\s+', ' ')
            .replaceAll('"', '\\\\"')
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    def storeLocation = envOrProp('SIGNING_STORE_FILE', rootProject.file('keystore.jks').path)
    File resolvedStoreFile = null
    if (storeLocation != null) {
        def candidate = new File(storeLocation)
        resolvedStoreFile = candidate.isAbsolute() ? candidate : rootProject.file(storeLocation)
    }

    signingConfigs {
        release {
            if (resolvedStoreFile != null) {
                storeFile = resolvedStoreFile
            }
            storePassword = envOrProp('SIGNING_STORE_PASSWORD')
            keyAlias = envOrProp('SIGNING_KEY_ALIAS')
            keyPassword = envOrProp('SIGNING_KEY_PASSWORD')
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            if (this.respondsTo('enableV4Signing')) {
                enableV4Signing = true
            }
        }
        debug {
            if (resolvedStoreFile?.exists() && envOrProp('SIGNING_STORE_PASSWORD') != null) {
                initWith signingConfigs.release
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'minify/proguard-main.pro',
                    'minify/proguard-okhttp.pro',
                    'minify/proguard-retrofit.pro',
                    'minify/proguard-jackson.pro',
                    'minify/proguard-kotlin-reflect.pro',
                    'minify/proguard-kotlin.pro',
                    'minify/proguard-capacitor.pro'

            buildConfigField "String", "DEFAULT_SERVERS_JSON", "\"${getServerJson(false)}\""
            resValue "string", "common_appname", "MuMa"
        }
        debug {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            applicationIdSuffix = '.debug'
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
            matchingFallbacks = ['release']

            buildConfigField "String", "DEFAULT_SERVERS_JSON", "\"${getServerJson(true)}\""
            resValue "string", "common_appname", "MuMa Debug"
        }
    }

    sourceSets {
        main.java.srcDirs += "${projectDir}/src/main/kotlin"
        test.java.srcDirs += "${projectDir}/src/test/kotlin"
        main.assets.srcDirs += "${projectDir}/src/main/assets"
    }

    task copyChangelog(type: Copy) {
        from "${rootDir}/CHANGELOG.md"
        from "${rootDir}/RELEASE_NOTES.md"
        into "${projectDir}/src/main/assets/"
    }

    preBuild.dependsOn copyChangelog

    /*
     * The web bundle the Capacitor shell serves.
     *
     * `services/frontend/dist` is built by Node, which the Android CI image does not have, so
     * the bundle is never a build requirement: when it is there it is copied in, and when it is
     * not the task writes a single page that says so. That keeps `assembleDebug` working on a
     * bare checkout, in the emulator smoke job and on a runner that has never seen npm, while
     * `frontend:bundle` supplies the real thing in the pipelines that build a shippable APK.
     *
     * `src/main/assets/public` is gitignored for the same reason `CHANGELOG.md` above is copied
     * rather than committed: it is a build product that happens to live in a source directory.
     */
    def frontendDistDir = new File(rootProject.projectDir.parentFile, "frontend/dist")
    def webBundleDir = new File(projectDir, "src/main/assets/public")

    tasks.register("prepareWebBundle") {
        description = "Stages services/frontend/dist into the APK assets, or a placeholder page."
        inputs.files(fileTree(frontendDistDir)).withPropertyName("frontendDist").optional()
        outputs.dir(webBundleDir)
        doLast {
            webBundleDir.deleteDir()
            webBundleDir.mkdirs()
            def hasBundle = new File(frontendDistDir, "index.html").isFile()
            if (hasBundle) {
                def src = frontendDistDir.toPath()
                def dst = webBundleDir.toPath()
                java.nio.file.Files.walk(src).forEach { path ->
                    def target = dst.resolve(src.relativize(path).toString())
                    if (java.nio.file.Files.isDirectory(path)) {
                        java.nio.file.Files.createDirectories(target)
                    } else {
                        java.nio.file.Files.createDirectories(target.getParent())
                        java.nio.file.Files.copy(
                                path, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }
                logger.lifecycle("prepareWebBundle: copied the Svelte bundle from $frontendDistDir")
            } else {
                new File(webBundleDir, "index.html").setText("""<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuMa - webbundel ontbreekt</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem;
         background: #121212; color: #f5f5f5; line-height: 1.5; }
  code { background: #262626; padding: .1rem .35rem; border-radius: .25rem; }
  h1 { font-size: 1.25rem; }
  p { max-width: 40rem; }
</style>
</head>
<body>
<h1>De webbundel is niet gebouwd</h1>
<p>Deze APK is samengesteld zonder <code>services/frontend/dist</code>, dus de nieuwe interface
zit er niet in. Dit is geen fout in de app: de Android-build heeft geen Node en draait bewust
door zonder bundel.</p>
<p>Bouw de bundel met <code>services/frontend/node_modules/.bin/vite build</code> en bouw de APK
opnieuw, of gebruik een APK uit een pipeline waarin <code>frontend:bundle</code> heeft gedraaid.</p>
<hr>
<h1>The web bundle was not built</h1>
<p>This APK was assembled without <code>services/frontend/dist</code>, so the new interface is
not in it. Nothing failed: the Android build has no Node and deliberately carries on without a
bundle.</p>
<p>Build it with <code>services/frontend/node_modules/.bin/vite build</code> and rebuild the APK,
or install an APK from a pipeline in which <code>frontend:bundle</code> ran.</p>
</body>
</html>
""", "UTF-8")
                logger.lifecycle("prepareWebBundle: no bundle at $frontendDistDir, wrote a placeholder")
            }
        }
    }

    preBuild.dependsOn "prepareWebBundle"

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE']
        }
    }


    buildFeatures {
        viewBinding = true
        dataBinding = false
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    ksp {
        arg("room.schemaLocation", "$rootDir/app/schemas")
    }

    lint {
        baseline = file("lint-baseline.xml")
        checkReleaseBuilds = false
        abortOnError = true
        warningsAsErrors = true
        warning 'ImpliedQuantity'
        disable 'MissingTranslation', 'UnusedQuantity', 'MissingQuantity'
        disable 'ObsoleteLintCustomCheck'
        disable 'NullSafeMutableLiveData'
        // We manage dependencies on Gitlab with RenovateBot
        disable 'GradleDependency'
        disable 'AndroidGradlePluginVersion'
        // Same reason, for the version catalog: AGP 9's lint reads
        // libs.versions.toml and reports every entry it considers behind. That
        // is Renovate's job, and baselining eleven of them would mean a stale
        // baseline after every dependency merge request.
        disable 'NewerVersionAvailable'
        textReport = true
        checkDependencies = true
    }

    testOptions {
        unitTests {
            // Robolectric can only resolve the app's own resources when they are packaged for
            // the unit test run; without this every getString/inflate throws NotFoundException.
            includeAndroidResources = true
            all {
                // Robolectric downloads its android-all jars into maven.repo.local, by default
                // ~/.m2 -- which is not kept between CI containers, so every run fetched them
                // from repo1.maven.org again until it answered 429 (60 classes in
                // initializationError). The Gradle user home is the cache that is kept
                // (scripts/ci/android-gradle-home.sh), and Google's mirror of Maven Central
                // serves the jars when repo1 rate-limits this network.
                systemProperty 'maven.repo.local', "${gradle.gradleUserHomeDir}/robolectric-m2"
                systemProperty 'robolectric.dependency.repo.url',
                    'https://maven-central.storage-download.googleapis.com/maven2'
            }
        }
    }

    /*
    testOptions {
        managedDevices {
            devices {
                pixel10Pro (ManagedVirtualDevice) {
                    device = "Pixel 7"
                    apiLevel = 35
                    systemImageSource = "aosp-atd"
                }
            }
        }
    }
    */
    namespace = 'nl.teunschriks.mumamobile'

}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

