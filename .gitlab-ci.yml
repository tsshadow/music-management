# GitLab CI pipeline (Task 8 of the test plan).
#
# Only wires up commands that are already verified to work locally via the
# scripts under scripts/test/ (see AGENTS.md -> "Full test inventory & local
# commands" and docs/testing-inventory.md). CI must never be the place where a
# script is tried for the first time: run it locally first, then add it here.
#
# Requires a Linux GitLab Runner with Docker + Docker Compose available
# (shell or docker executor with access to the host's Docker daemon).

default:
  interruptible: true
  hooks:
    # Safety net only. The MuMa Mobile jobs used to build inside a root-running
    # Android SDK container and hand the workspace back via an EXIT trap; a hard
    # kill of the runner host - reboot, LXC stop, OOM - skipped that trap and
    # left root-owned Gradle output behind, which broke the *next* job in
    # get_sources ("Permission denied" on git clean) before any script in this
    # file could run.
    #
    # Since docker/Dockerfile-android-ci those containers run as the runner's
    # own uid, so this should never find anything. Keep it until no runner has a
    # pre-existing root-owned workspace; if it ever logs its warning again,
    # something started running as root again and that is the bug to fix.
    pre_get_sources_script:
      - |
        if [ -d "$CI_PROJECT_DIR" ] && [ -n "$(find "$CI_PROJECT_DIR" ! -user "$(id -u)" -print -quit 2>/dev/null)" ]; then
          echo "WARNING: reclaiming files not owned by $(id -un) in $CI_PROJECT_DIR - something ran as root"
          docker run --rm -v "$CI_PROJECT_DIR:/workspace" alpine chown -R "$(id -u):$(id -g)" /workspace
        fi

# Which pipelines exist at all. Without this, every job whose rules are
# `changes:`-only also matches merge_request_event, so a push to a branch that
# has an open merge request creates a branch pipeline *and* an MR pipeline for
# the same commit and runs the entire suite twice. The workaround for the
# resulting Gradle cache collision is still visible in
# scripts/test/muma-mobile-unit.sh.
workflow:
  rules:
    # Release and hotfix branches always get their own branch pipeline, even
    # while an MR is open for them. deploy:prod, release:version-check and
    # friends all match on $CI_COMMIT_BRANCH, which is unset in a merge request
    # pipeline -- so if the duplicate-pipeline guard below applied here, the
    # release would simply never be deployed.
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
    # Scheduled pipelines (security:dependency-audit) always run.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Prefer the merge request pipeline...
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # ...and drop the redundant branch pipeline while an MR is open for it.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    # Branches without an open MR (develop, master).
    - if: '$CI_COMMIT_BRANCH'

stages:
  - quality
  - unit
  - integration
  - e2e
  - release
  - deploy

# Referenced by every job that gates a production deploy. Those jobs also have
# `changes:` rules, which is what keeps ordinary feature pushes cheap -- but on
# a release/hotfix branch the last commit usually touches only VERSION,
# CHANGELOG.md and RELEASE_NOTES.md, so `changes:` alone would skip them, and a
# skipped job does not block deploy:prod. This rule makes them unconditional
# exactly where it matters.
.release_rule:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'

# Retried only where the code under test never got a fair run. Retrying a
# script_failure would turn a flaky test green and hide it.
.infra_retry:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# node_modules keyed on the lockfile: a cold checkout otherwise re-runs
# `npm install` from scratch (see scripts/test/frontend-unit.sh).
.npm_cache:
  cache:
    key:
      files:
        - services/frontend/package-lock.json
    paths:
      - services/frontend/node_modules/

# --- Static analysis ---------------------------------------------------------
# Runs the same scripts/lint.sh the pre-commit hook runs, so a commit made with
# --no-verify, or through the GitLab web UI, still meets the same bar. Both the
# ruff rule set and the pylint threshold live in the repo (pyproject.toml,
# .pylintrc) rather than in this file.

quality:lint:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.release_rule, rules]
    - changes:
        - services/**/*.py
        - tools/**/*.py
        - scripts/**/*.sh
        - pyproject.toml
        - .pylintrc
        - .gitlab-ci.yml
  script:
    - ./scripts/lint.sh

# Type checking, rolled out per module. pyproject.toml holds a loose floor for
# the whole tree plus a list of modules checked strictly; scripts/typecheck.sh
# runs that list. The list only ever grows -- cleaning a module up means fixing
# its findings and adding it there in the same merge request.
quality:typecheck:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.release_rule, rules]
    - changes:
        - services/**/*.py
        - pyproject.toml
        - scripts/typecheck.sh
        - .gitlab-ci.yml
  script:
    - ./scripts/typecheck.sh

# Dependency vulnerability scanning of the declared requirements and the
# frontend lockfile -- repository-controlled, so a finding always points at a
# line someone can change here. Runs on a schedule (so a newly published CVE
# surfaces without anyone pushing), on the default branch, and manually.
#
# allow_failure because it queries the advisory database over the network: a
# transient outage should not turn master red. Read the job log. Findings that
# genuinely cannot be fixed yet are listed, with a reason, in
# security/accepted-vulnerabilities.txt.
security:dependency-audit:
  stage: quality
  timeout: 15m
  interruptible: false
  allow_failure: true
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
  script:
    - ./scripts/ci/dependency-audit.sh

# Committed-credential scan. allow_failure is deliberately absent: unlike the
# dependency audit, this one does not depend on a third-party service being
# reachable, so a failure here is a finding, not an outage. Path exemptions
# live in security/gitleaks.toml, per-finding ones in .gitleaksignore.
security:secret-scan:
  stage: quality
  timeout: 15m
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.release_rule, rules]
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - "**/*"
  script:
    - ./scripts/ci/secret-scan.sh

# --- Unit tests -------------------------------------------------------------

music-management:unit:
  stage: unit
  timeout: 20m
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.release_rule, rules]
    - changes:
        - services/music_manager/**/*
        - services/importer/**/*
        - services/downloader/**/*
        - services/tagger/**/*
        - services/scanner/**/*
        - services/common/**/*
        - pytest.ini
        - .gitlab-ci.yml
  script:
    - echo "--- ENV DEBUG ---"
    - hostname
    - ip addr
    - whoami
    - pwd
    - ls -la /home/gitlab-runner/builds || true
    - echo "--- END ENV DEBUG ---"
    - ./scripts/test/music-management-unit.sh
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    # A test report that is only uploaded when the job succeeds is useless: the
    # run worth inspecting is the failed one.
    when: always
    reports:
      junit: report-python.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-python.xml

lms:unit:
  stage: unit
  timeout: 45m
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.release_rule, rules]
    - changes:
        - services/music-management-server/**/*
        - .gitlab-ci.yml
  script:
    - ./scripts/test/lms-unit.sh
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)\%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-lms.xml

frontend:unit:
  stage: unit
  timeout: 15m
  retry: !reference [.infra_retry, retry]
  cache: !reference [.npm_cache, cache]
  rules:
    - !reference [.release_rule, rules]
    - changes:
        - services/frontend/**/*
        - .gitlab-ci.yml
  script:
    - ./scripts/test/frontend-unit.sh
  coverage: '/All files\s*\|\s*[\d\.]+\s*\|\s*[\d\.]+\s*\|\s*[\d\.]+\s*\|\s*([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/frontend/coverage/cobertura-coverage.xml

muma-mobile:check:
  stage: unit
  timeout: 45m
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.release_rule, rules]
    - changes:
        - services/muma-mobile/**/*
        - .gitlab-ci.yml
  script:
    - ./scripts/test/muma-mobile-unit.sh
  coverage: '/Total.*?(\d+(?:\.\d+)?\%)/'
  artifacts:
    when: always
    reports:
      junit: services/muma-mobile/app/build/test-results/**/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: cobertura-muma-mobile.xml

# Runs first, in the very first stage, so a release pipeline fails fast (before
# any image is built) if a required deployment secret (e.g. GOOGLE_CLIENT_ID)
# is missing -- see scripts/ci/check-required-secrets.sh for the rationale.
# GitLab has no built-in way to require a key inside a file-type CI/CD
# variable to be set, so this job IS that requirement (AGENTS.md rule 1/10):
# a release pipeline that skips or ignores this job is not considered passing.
release:check-secrets:
  stage: unit
  timeout: 5m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
  script:
    - ./scripts/ci/check-required-secrets.sh

# Runs every endpoint's SQL against a real MariaDB. The unit suite mocks the
# database cursor, so it can only prove the right SQL string was produced -- a
# column that does not exist, or a table the schema bootstrap never creates,
# passes there and fails in production. This job is what caught the missing
# downloads_youtube_accounts.channel_id and library_track_ml_labels.updated_at
# columns. It also applies every migrate_*.sql twice, so a migration that is not
# re-runnable fails here rather than on deploy.
db:integration:
  stage: integration
  timeout: 30m
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - services/music_manager/**/*
        - services/common/db_init.py
        - migrate_*.sql
        - tests/integration/**/*
        - .gitlab-ci.yml
  script:
    - ./scripts/test/db-integration.sh

# --- Integration / contract tests -------------------------------------------
# These build and start docker/compose.test.yml from a clean state, so they
# always run on the default branch, and on any merge request that touches
# something the test stack itself depends on.

contracts:
  stage: integration
  timeout: 30m
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - services/music-management-server/**/*
        - services/music_manager/**/*
        - docker/compose.test.yml
        - tests/fixtures/**/*
        - tests/contracts/**/*
        - .gitlab-ci.yml
  script:
    - ./scripts/test/contracts.sh

# --- Browser end-to-end ------------------------------------------------------

frontend:browser:
  stage: e2e
  timeout: 30m
  retry: !reference [.infra_retry, retry]
  cache: !reference [.npm_cache, cache]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - services/frontend/**/*
        - docker/compose.test.yml
        - tests/fixtures/**/*
        - .gitlab-ci.yml
  script:
    - ./scripts/test/frontend-browser.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - services/frontend/test-results/

# --- Release stabilization ---------------------------------------------------
# Branch model: feature/* -> develop (integration) -> release/x.y.z
# (stabilization + prod deploy) -> master (tagged production record).
# See docs/release-management.md for the full policy.

release:version-check:
  stage: release
  timeout: 5m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
  script:
    - ./scripts/ci/release-version-check.sh

release:build-images:
  stage: release
  timeout: 60m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\// && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
  script:
    - ./scripts/ci/build-and-push-images.sh

# Rebuilds the downloader image from master between releases so production picks
# up a newer yt-dlp. yt-dlp ships fixes for SoundCloud/YouTube changes within
# days, while our images are otherwise only ever built on a release/* branch --
# which is how downloads stop working without anything here having changed.
#
# Runs only from a GitLab schedule with REFRESH_DOWNLOADER set, and only on
# master, so the image published as :latest is built from the commit production
# is already running. It does not deploy: Watchtower pulls :latest on the host.
images:refresh-downloader:
  stage: release
  timeout: 60m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $REFRESH_DOWNLOADER == "true" && $CI_COMMIT_BRANCH == "master" && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
  script:
    - ./scripts/ci/refresh-downloader-image.sh

muma-mobile:build-debug:
  stage: release
  timeout: 45m
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $APK_HOSTER_URL'
      changes:
        - services/muma-mobile/**/*
        - .gitlab-ci.yml
    # Manual opt-in for merge request / feature branches: lets a reviewer build
    # and upload a debug APK for a specific MR (e.g. to test a UI fix against
    # prod before merging) without doing it for every push on every branch.
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $APK_HOSTER_URL'
      changes:
        - services/muma-mobile/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - ./scripts/ci/muma-mobile-build-upload.sh debug

muma-mobile:build-release:
  stage: release
  timeout: 45m
  retry: !reference [.infra_retry, retry]
  needs:
    - release:version-check
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\// && $APK_HOSTER_URL && $SIGNING_STORE_FILE'
  script:
    - ./scripts/ci/muma-mobile-build-upload.sh release

# --- Deployment --------------------------------------------------------------

deploy:prod:
  stage: deploy
  timeout: 30m
  interruptible: false
  # Deliberately no `retry:`. A deploy that failed halfway has already changed
  # the host; repeating it automatically hides which half succeeded.
  # Only one production deploy at a time. Two release pipelines overlapping is
  # exactly how bug-report 016 happened: a delayed pipeline on an already-merged
  # release branch re-pushed old images as `latest` and redeployed them. Set the
  # process mode of this resource group to "newest first" in
  # Settings > CI/CD > Resource groups, so a queued older pipeline is dropped
  # rather than applied after the newer one.
  resource_group: production
  environment:
    name: production
    url: $PROD_URL
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
  script:
    - ./scripts/ci-deploy.sh

release:tag:
  stage: deploy
  timeout: 10m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - ./scripts/ci/create-release-tags.sh

release:back-merge-develop:
  stage: deploy
  timeout: 10m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  needs:
    - release:tag
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - ./scripts/ci/back-merge-develop.sh
