version: "3.9"

x-environment-db: &environment-db
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_USER: ${DB_USER}
  DB_PASS: ${DB_PASS}
  DB_DB: ${DB_DB}
  API_KEY: ${API_KEY:-}
  # The deployment's .env spells the system key MUMA_API_KEY, not API_KEY, and
  # compose does NOT support a nested "${A:-${B}}" default (see the comment on
  # MUMA_SERVER_SUBSONIC_API_KEY below), so both are passed through as-is and
  # the fallback happens in Python (services/music_manager/api_key.py). Passing
  # only API_KEY left the containers with an empty system key once the literal
  # fallback was removed from the code, which rejected every service-to-service
  # call with 401/403 -- LMS scrobble/rating webhooks and the management UI.
  MUMA_API_KEY: ${MUMA_API_KEY:-}
  AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}

x-environment-telegram: &environment-telegram
  telegram_api_id: "${telegram_api_id}"
  telegram_api_hash: "${telegram_api_hash}"
  telegram_session: ${telegram_session}
  telegram_folder: ${telegram_folder}
  telegram_accounts: "${telegram_accounts}"

x-environment-downloader: &environment-downloader
  youtube_folder: ${youtube_folder}
  youtube_video_folder: ${youtube_video_folder}
  youtube_archive: ${youtube_archive}
  youtube_accounts: ${youtube_accounts}
  soundcloud_folder: ${soundcloud_folder}
  soundcloud_archive: ${soundcloud_archive}
  soundcloud_accounts: ${soundcloud_accounts}
  ffmpeg_location: /usr/local/bin
  ytdlp: yt-dlp

x-environment-paths: &environment-paths
  import_folder_path: ${import_folder_path}
  eps_folder_path: ${eps_folder_path}
  music_folder_path: ${music_folder_path}

# Where LMS is and how to talk to it. music-manager needed this from the start; the
# workers need it since they announce the files they tag themselves (services/tagger/
# announce.py) instead of leaving them for the next folder walk. "lms" is the
# container_name in the separate lms stack, reachable over the shared network. The two
# key names are both passed as-is because compose has no nested "${A:-${B}}" default;
# the fallback between them happens in Python (services/common/Helpers/LmsEndpoint.py).
x-environment-lms: &environment-lms
  MUMA_SERVER_HOSTS: "lms:5082"
  MUMA_SERVER_SUBSONIC_API_KEY: ${MUMA_SERVER_SUBSONIC_API_KEY:-}
  LMS_SUBSONIC_API_KEY: ${LMS_SUBSONIC_API_KEY:-}

# Every service logs through json-file with rotation. Docker's default is
# json-file *without* a size cap, so a chatty worker grows its log under
# /var/lib/docker until the disk is full -- and on this host a full disk has
# already looked like an unrelated 502 (nginx logs just stop). 3 x 10 MB per
# container is plenty for `docker logs`; the event log is the real history.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The workers have no HTTP port to probe and no heartbeat, so this is a light
# check by design: it runs Python inside the container (proving the process
# namespace and interpreter are alive -- a dead PID 1 stops the container and
# the restart policy takes over) and opens a TCP connection to the database,
# the one dependency every worker loop needs. It does not detect a loop that
# hangs while the process lives; nothing short of a heartbeat would. What it
# buys is that `docker ps` and scripts/ci/post-deploy-verify.sh see "unhealthy"
# for a worker that cannot reach MariaDB, instead of a green "Up".
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "python", "-c", "import os, socket; h, _, p = (os.environ.get('DB_HOST') or 'db').partition(':'); socket.create_connection((h, int(p or os.environ.get('DB_PORT') or 3306)), 5).close()"]
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 60s

# Container hardening (issue #32; muma-ops docs/deployment-production.md, "Container hardening").
#
# Every service drops all Linux capabilities and adds back only what it was
# shown to need. The muma Python images (music-manager, the workers, the tools
# one-shots) run as root and write to host directories owned by several users
# -- the music share, LMS's lms.db, the data volumes -- so they keep exactly the
# capabilities that make root's file access behave as it does today (CHOWN,
# DAC_OVERRIDE, FOWNER, FSETID; the importer chmods what it moves) and lose the
# rest: raw sockets (NET_RAW, ARP/DNS spoofing on the bridge), MKNOD, SETUID/
# SETGID, SETPCAP/SETFCAP, SYS_CHROOT, NET_BIND_SERVICE, KILL, AUDIT_WRITE.
# None of them calls setuid, binds below 1024, or signals a process of another
# user: every child process (ffmpeg, yt-dlp) runs as the same root.
#
# pids_limit caps threads *and* processes (the pids cgroup counts tasks). Each
# value is well above what the service was seen using on production
# (`docker stats`, PIDS column, 2026-09-27) -- a fork bomb or a thread leak
# stops at the limit instead of exhausting the host's PID space, which would
# take LMS and the database down with it.
#
# Not applied here yet, and why, is listed under "Container hardening" in
# muma-ops docs/deployment-production.md: a read-only root filesystem and a non-root user for the
# muma images, and any of it for Firefox. tests/ci/test_compose_hardening.py
# pins what is applied.
x-root-file-caps: &root-file-caps
  - CHOWN
  - DAC_OVERRIDE
  - FOWNER
  - FSETID

services:
  db:
    security_opt:
      - no-new-privileges:true
    # The official entrypoint starts as root: it chowns the data and socket
    # directories to mysql (CHOWN, and DAC_OVERRIDE/FOWNER to walk a data
    # directory mysql owns) and then switches to that user with gosu (SETUID,
    # SETGID). `docker exec ... healthcheck.sh` reads the mysql-owned
    # .my-healthcheck.cnf, which is DAC_OVERRIDE again. No read_only: MariaDB's
    # tmpdir is /tmp, and a big filesort or ALTER spilling into a tmpfs there
    # would be charged to this container's 2g memory limit.
    # 34 PIDs on production; max_connections is 151, each a thread.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 1024
    # Pinned by digest (bug report 094): `mariadb:13.0` floats, so the same
    # compose file could start a different server on every DEPLOY_DB=1 deploy.
    # Renovate's pinDigests rule for `mariadb` (renovate.json) moves version and
    # digest together; it never merges on its own. A new major or minor needs
    # mariadb-upgrade, which MARIADB_AUTO_UPGRADE below has the entrypoint run.
    image: mariadb:13.0.2@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
    container_name: music-management-db-1
    labels:
      # Never updated by Watchtower: music-manager, the database and the tools change only through a deploy (issue #68).
      com.centurylinklabs.watchtower.enable: "false"
    logging: *default-logging
    restart: unless-stopped
    # Measured 661 MiB on production (docker stats, 2026-09-25). What MariaDB
    # allocates up front is fixed by its defaults -- no my.cnf is mounted:
    # innodb_buffer_pool_size, key_buffer_size and aria_pagecache_buffer_size are
    # 128 MiB each (checked with SHOW GLOBAL VARIABLES; Memory_used_initial is
    # 470 MiB). On top of that each connection can take its sort, join and
    # in-memory temp-table buffers (2 MiB + 256 KiB + 16 MiB). Max_used_connections
    # was 29 over 53 hours of uptime, so a peak where every one of those fills its
    # buffers at once is ~1 GiB. A mariadb-dump or the restore check into a scratch
    # database adds connections, not buffer pool. 2g is three times what it uses
    # and twice that peak; raise it together with innodb_buffer_pool_size if that
    # is ever tuned upward. Like
    # every setting on `db`, it only applies when `db` is recreated -- a
    # DEPLOY_DB=1 deploy. Override with MUMA_MEM_LIMIT_DB.
    mem_limit: ${MUMA_MEM_LIMIT_DB:-2g}
    # MariaDB 11.5 changed the server default to utf8mb4_uca1400_ai_ci, and the
    # 10.10 -> 12.3 migration inherited it: the restored tables kept their own
    # utf8mb4_general_ci, but anything created afterwards would not. A join
    # between the two raises "Illegal mix of collations", which surfaces on the
    # first new table rather than on the upgrade that caused it. Pinned to what
    # the data already is; moving the whole schema to uca1400 is a separate,
    # deliberate job because it changes uniqueness semantics.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # The image's documented switch for an existing data directory: when the
      # server is newer than the data (mariadb_upgrade_info), the entrypoint
      # backs the system tables up to system_mysql_backup_*.sql.zst in the data
      # directory and runs mariadb-upgrade before the real server starts.
      # Without it a 12.3 -> 13.0 move leaves the system tables un-upgraded.
      # scripts/deploy.sh checks the result after every DEPLOY_DB=1 recreate.
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_DB}
    # Loopback by default: every client of this database is a container on the
    # music-management_db network and reaches it as db:3306. Anything on the
    # LAN that needs it directly (the workstation's read-only MCP,
    # tools/muma_mcp, connects to the production host's port 3306) sets DB_BIND_ADDRESS to
    # the host's LAN address in the stack's .env -- a deliberate opt-in rather
    # than MariaDB root being reachable from every device on the network.
    # Takes effect only when `db` is recreated, i.e. on a DEPLOY_DB=1 deploy.
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:3306:3306"
    volumes:
      - ${HOST_DATA_PATH}/mariadb:/var/lib/mysql
    networks:
      - music-management_db

  phpmyadmin:
    security_opt:
      - no-new-privileges:true
    # Apache's parent runs as root, binds :80 (NET_BIND_SERVICE), starts its
    # children as www-data (SETUID, SETGID) and signals them (KILL); the
    # entrypoint writes its config as root. 6 PIDs on production.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    pids_limit: 256
    image: phpmyadmin:5.2.3@sha256:fb0cb638f7d1c2529407921d86679b2b2faf5bb8542314821e9f16e7e3d2954f
    container_name: music-management-phpmyadmin-1
    labels:
      # Never updated by Watchtower: music-manager, the database and the tools change only through a deploy (issue #68).
      com.centurylinklabs.watchtower.enable: "false"
    logging: *default-logging
    restart: unless-stopped
    # Measured 3 MiB idle (2026-09-25); PHP's own memory_limit caps one request
    # (an export of a big table is the peak). 256m is ample.
    mem_limit: ${MUMA_MEM_LIMIT_PHPMYADMIN:-256m}
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    # Loopback by default, reached through `ssh -L 8002:127.0.0.1:8002
    # root@<host>`: phpMyAdmin logs in with database credentials, and was open
    # to every device on the LAN. PHPMYADMIN_BIND_ADDRESS opts back in.
    ports:
      - "${PHPMYADMIN_BIND_ADDRESS:-127.0.0.1}:8002:80"
    networks:
      - music-management_db

  # Consolidated Music Manager Service
  music-manager:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: *root-file-caps
    pids_limit: 1024
    image: ${DOCKER_USER}/${IMAGE_CORE}:${IMAGE_TAG:-latest}
    container_name: music-manager
    labels:
      # Never updated by Watchtower: music-manager, the database and the tools change only through a deploy (issue #68).
      com.centurylinklabs.watchtower.enable: "false"
    logging: *default-logging
    restart: unless-stopped
    # GET /health answers 503 when the database is unreachable or one of the
    # long-running loops (tagger, scanner, radio, events) has died, so this is
    # the honest signal. No curl in this image; urllib raises on any non-2xx.
    # start_period covers the thread registry filling up after a start.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # A ceiling, not a reservation: on a host whose RAM is shared with MariaDB
    # and LMS, one runaway container can otherwise push the others into the
    # OOM killer. No sizing is documented for this host; 4g is a
    # conservative guess -- check `docker stats` after the first deploy and
    # override with MUMA_MEM_LIMIT_MANAGER in the stack's .env.
    mem_limit: ${MUMA_MEM_LIMIT_MANAGER:-4g}
    ports:
      - "8000:8000"
      - "8003:8000" # Backward compatibility for control center
    depends_on:
      - db
    environment:
      <<: [*environment-db, *environment-paths, *environment-lms]
      MUMA_SERVER_DB_ROOT: /app/data
      STORAGE_PATH: /mnt/music/artists
      PYTHONPATH: /app
      API_KEY: ${API_KEY:-}
      MUMA_API_KEY: ${MUMA_API_KEY:-}
      # LMS host and keys come from the environment-lms anchor above. See
      # muma-ops docs/deployment-production.md for why LMS is deployed as its own stack instead of
      # an inline service here.
      NOTIFY_URL: ${NOTIFY_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # Where users get the source (AGPL-3.0 section 13); the About and login screens link to it.
      PUBLIC_SOURCE_URL: ${PUBLIC_SOURCE_URL:-https://github.com/OWNER/music-management}
      # The artist-image fetcher's and the tagger's third-party keys. Until 2026-09-21
      # nothing carried these into the container: they came along inside the .env the
      # image used to COPY, and when that COPY went (2026-07-24) the fetcher ran blind
      # and recorded 45.000 artists as unfindable. The same keys can be set on
      # Beheer > Config instead; that value wins over these.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      # Where the hourly news bulletins are written. Set NEWS_DATA_PATH in the
      # prod .env rather than leaning on the default below: production runs
      # docker-compose v1, so defaults here are worth as little trust as
      # possible (see MUMA_SERVER_SUBSONIC_API_KEY above).
      NEWS_DATA_DIR: /app/data/news
      # Alleen om /health/backup te kunnen beantwoorden. De backupjob zelf draait
      # in de tools-stack; music-manager leest hier niets anders dan latest.json.
      BACKUP_PATH: /backups
      BACKUP_STALE_AFTER_HOURS: ${BACKUP_STALE_AFTER_HOURS:-36}
      # The tagger shares this process with the API. Worker threads per slice and the
      # pause between slices are the two knobs that keep /api answering while a big
      # retag queue drains; the code defaults (12, 0.5 s) apply when these are unset.
      TAGGER_WORKERS: ${TAGGER_WORKERS:-}
      TAGGER_BATCH_PAUSE: ${TAGGER_BATCH_PAUSE:-}
      # The zone a daily mix's day is counted in. The container itself runs on UTC; empty
      # means the code default, Europe/Amsterdam. See muma-ops docs/deployment-production.md.
      MUMA_TIMEZONE: ${MUMA_TIMEZONE:-}
    volumes:
      # NOTE: these must point at the *actual* host directories used by the separate
      # "lms" stack (services/music-management-server/docker-compose.yml,
      # `${DOCKER_DATA_PATH:-/docker}/lms/var/lms` and `.../alpha-lms/var/lms`), NOT at a
      # path under this stack's own ${HOST_DATA_PATH}. A previous mismatch here (pointing at
      # `${HOST_DATA_PATH}/music-management-server/var/lms`, which never existed) silently
      # broke the LMS DB sync (users/playlists/artist image sync into the player's native
      # DB) in production - see docs/bug-reports/004-artist-images-not-working.md.
      # /app/data is what MUMA_SERVER_DB_ROOT calls the container's persistent directory,
      # and until 2026-09-21 it was not: only the three sub-paths below were mounted, so
      # Beheer > Config (`data/config.json`, ConfigStore) and the tagger's last-walk stamp
      # lived in the container's own layer and vanished on every redeploy. Docker mounts
      # parents before their nested paths, so the three below still land inside it.
      - ${HOST_DATA_PATH}/music-manager:/app/data
      - ${LMS_DATA_PATH:-/docker/lms}/var/lms:/app/data/stable:rw
      - ${ALPHA_LMS_DATA_PATH:-/docker/alpha-lms}/var/lms:/app/data/alpha:rw
      - ${HOST_MUSIC_PATH}:/mnt/music
      # Read-only, and only for /health/backup: the endpoint reports how old the
      # newest dump is so a monitor outside this host notices a backup schedule
      # that has stopped running. music-manager must never write here -- the one
      # thing a backup directory cannot afford is another writer.
      # Default is load-bearing: production runs docker-compose v1, and an unset
      # variable here renders as ":/backups:ro", which is not a mount but a
      # syntax error that stops the whole stack. If the path does not exist the
      # endpoint answers 503 "missing", which is the failure we want -- visible,
      # not fatal.
      - ${HOST_BACKUP_PATH:-/mnt/backups/muma}:/backups:ro
      # News bulletins are recorded off a live stream and deliberately stay out
      # of the music library, so they get their own volume rather than a corner
      # of ${HOST_MUSIC_PATH}. See docs/news-mode.md.
      - ${NEWS_DATA_PATH:-/docker/muma-news}:/app/data/news
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - music-management_db

  # One-shot, never started by `up`: scripts/deploy.sh runs it before the new containers
  # start, with the image of the release being deployed (SCHEMA_IMAGE_TAG). It adds the
  # tables, columns and indexes that release declares and drops or changes nothing
  # (services/common/schema_reconcile.py, docs/self-hosting.md#schema-changes). It connects as
  # root: it builds the declaration in a scratch database first, which the application user
  # may not create.
  # One-shot: scripts/deploy.sh runs it in step (d), before the new containers
  # start, and leaves it out of `up`. It adds what the database lacks and reports
  # the rest (services/common/schema_reconcile.py, docs/self-hosting.md#schema-changes).
  schema-reconcile:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    image: ${DOCKER_USER}/${IMAGE_CORE}:${SCHEMA_IMAGE_TAG:-latest}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging: *default-logging
    restart: "no"
    entrypoint: ["python", "-m", "services.common.schema_reconcile"]
    command: []
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DB: ${DB_DB}
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      PYTHONPATH: /app
    networks:
      - music-management_db

  # NOTE: LMS (the web player + Subsonic API, on the web-player and LMS host names)
  # is NOT defined here. It is deployed as its own, separate stack from
  # services/music-management-server/docker-compose.yml ("lms" project: "lms"
  # + "reverse-proxy" services), which is why it joins this stack's
  # "music-management_db" network as an external network below. Both stacks
  # are deployed together by the CI "muma:deploy" job (scripts/ci-deploy.sh).
  # See muma-ops docs/deployment-production.md for the full rationale and rollback procedure.

  # The following services are now integrated into music-manager:
  # - control-center (management-api)
  # - rating-system
  # - scrobble-service
  # - user-service
  # - stats-service
  # - artist-image-fetcher

  # control-center:
  #   image: ${DOCKER_USER}/${IMAGE_MANAGEMENT}:latest
  #   container_name: muma-control-center
  #   ...

  # importer_api:
  #   image: ${DOCKER_USER}/${IMAGE_APP}:latest
  #   container_name: muma-importer-api
  #   restart: unless-stopped
  #   depends_on:
  #     - db
  #   command:
  #     [
  #       "uvicorn",
  #       "services.common.api.server:app",
  #       "--host",
  #       "0.0.0.0",
  #       "--port",
  #       "8001"
  #     ]
  #   environment:
  #     PORT: 8001
  #     PYTHONPATH: /app:/app/services/downloader
  #     DB_HOST: ${DB_HOST}
  #     DB_PORT: ${DB_PORT}
  #     DB_USER: ${DB_USER}
  #     DB_PASS: ${DB_PASS}
  #     DB_DB: ${DB_DB}
  #     telegram_api_id: "${telegram_api_id}"
  #     telegram_api_hash: "${telegram_api_hash}"
  #     telegram_session: ${telegram_session}
  #     API_KEY: ""
  #     CORS_ORIGINS: "*"
  #   ports:
  #     - "7001:8001"
  #   volumes:
  #     - ${HOST_DATA_PATH}/importer:/app/data
  #     - ${HOST_MUSIC_PATH}:/mnt/music
  #     - ${HOST_DATA_PATH}/shared:/shared
  #   networks:
  #     - music-management_db

  importer_worker:
    # Opt-in source worker: runs only when this profile is enabled (COMPOSE_PROFILES,
    # docs/self-hosting.md#source-workers-are-compose-profiles).
    profiles: ["importer"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: *root-file-caps
    pids_limit: 512
    image: ${DOCKER_USER}/${IMAGE_IMPORTER}:${IMAGE_TAG:-latest}
    container_name: muma-importer-worker
    labels:
      # Watchtower may update this image (bug 050 / issue #68): only the downloader images.
      com.centurylinklabs.watchtower.enable: "true"
    logging: *default-logging
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    # Conservative ceiling (yt-dlp + ffmpeg post-processing is the peak);
    # override with MUMA_MEM_LIMIT_IMPORTER. See the note on music-manager.
    mem_limit: ${MUMA_MEM_LIMIT_IMPORTER:-2g}
    depends_on:
      - db
    command:
      [
        "python",
        "services/importer/importer_service.py",
        "--repeat",
        "--sleeptime",
        "300"
      ]
    environment:
      <<: [*environment-db, *environment-paths, *environment-lms]
      NOTIFY_URL: ${NOTIFY_URL}
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "False"
      rescan: "True"
      delimiter: "${delimiter}"
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

  youtube_worker:
    profiles: ["youtube"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: *root-file-caps
    pids_limit: 512
    image: ${DOCKER_USER}/${IMAGE_DOWNLOADER}:${IMAGE_TAG:-latest}
    container_name: muma-youtube-worker
    labels:
      # Watchtower may update this image (bug 050 / issue #68): only the downloader images.
      com.centurylinklabs.watchtower.enable: "true"
    logging: *default-logging
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    # Conservative ceiling (yt-dlp + ffmpeg post-processing is the peak);
    # override with MUMA_MEM_LIMIT_DOWNLOADER. See the note on music-manager.
    mem_limit: ${MUMA_MEM_LIMIT_DOWNLOADER:-2g}
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "youtube",
        "--repeat",
        "--break-on-existing"
      ]
    environment:
      <<: [*environment-db, *environment-downloader, *environment-paths, *environment-lms]
      NOTIFY_URL: ${NOTIFY_URL}
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "False"
      rescan: "True"
      delimiter: "${delimiter}"
      YT_COOKIES: "firefox:/firefox-config/profile"
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
      - ${HOST_DATA_PATH}/firefox:/firefox-config:ro
    networks:
      - music-management_db

  soundcloud_worker:
    profiles: ["soundcloud"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: *root-file-caps
    pids_limit: 512
    image: ${DOCKER_USER}/${IMAGE_DOWNLOADER}:${IMAGE_TAG:-latest}
    container_name: muma-soundcloud-worker
    labels:
      # Watchtower may update this image (bug 050 / issue #68): only the downloader images.
      com.centurylinklabs.watchtower.enable: "true"
    logging: *default-logging
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    # Conservative ceiling (yt-dlp + ffmpeg post-processing is the peak);
    # override with MUMA_MEM_LIMIT_DOWNLOADER. See the note on music-manager.
    mem_limit: ${MUMA_MEM_LIMIT_DOWNLOADER:-2g}
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "soundcloud",
        "--repeat",
        "--break-on-existing"
      ]
    environment:
      <<: [*environment-db, *environment-downloader, *environment-paths, *environment-lms]
      NOTIFY_URL: ${NOTIFY_URL}
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "False"
      rescan: "True"
      delimiter: "${delimiter}"
      soundcloud_cookies: "firefox:/firefox-config/profile"
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
      - ${HOST_DATA_PATH}/firefox:/firefox-config:ro
    networks:
      - music-management_db

