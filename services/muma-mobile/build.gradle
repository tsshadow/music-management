import org.gradle.process.ExecOperations
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile


// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.bootstrap = [
            kotlinModule : "${project.rootDir}/gradle_scripts/kotlin-module-bootstrap.gradle",
            androidModule : "${project.rootDir}/gradle_scripts/android-module-bootstrap.gradle"
    ]

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath libs.ktlintGradle
        classpath libs.detekt
    }
}

plugins {
    id "com.github.ben-manes.versions" version "0.64.0"
    // SBOM for the dependency audit: scripts/ci/dependency-audit.sh runs
    // `cyclonedxBom` and feeds the result to trivy. Gradle has no lockfiles in
    // this repo, so the resolved graph in the SBOM is the only thing a CVE
    // scanner can read.
    id "org.cyclonedx.bom" version "3.4.1"
    alias libs.plugins.androidApplication apply false
    alias libs.plugins.androidLibrary apply false
    alias libs.plugins.kotlinAndroid apply false
    alias libs.plugins.ksp apply false
    alias libs.plugins.kotlinSerialization apply false
    alias libs.plugins.kotlinParcelize apply false
}

allprojects {
    // Buildscript here is required by detekt
    buildscript {
        repositories {
            mavenCentral()
            gradlePluginPortal()
            google()
        }
    }

    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()
    }

    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }

    // Set Kotlin JVM target to the same for all subprojects
    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_21)
        }
    }

    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs.add("-Xlint:deprecation")
        }
    }
}

// Only what ships: the default SBOM also walks detekt/ktlint/AGP tooling
// classpaths, whose netty/bouncycastle findings say nothing about the APK.
// releaseRuntimeClasspath covers the Android modules, runtimeClasspath the
// pure-Kotlin ones.
//
// Plugin 3.x split the single task in two: `cyclonedxDirectBom` resolves one
// project's configurations, `cyclonedxBom` only merges the results. That moved
// includeConfigs off the task the audit runs and onto the per-project one, so
// configuring it once on the root -- as 2.x did -- would silently leave every
// module on the default, tooling-classpaths-included graph.
//
// Applying the plugin to the root registers cyclonedxDirectBom in the
// subprojects too (CyclonedxPlugin.apply walks project + subprojects), so the
// plugin stays applied here only and this block reaches all four modules.
allprojects {
    tasks.withType(org.cyclonedx.gradle.CyclonedxDirectTask).configureEach {
        includeConfigs.set(["releaseRuntimeClasspath", "runtimeClasspath"])
    }
}

tasks.register("generateKeystore") {
    def keystoreFile = layout.projectDirectory.file("keystore.jks").asFile
    outputs.file(keystoreFile)
    
    doLast {
        if (keystoreFile.exists()) {
            println "keystore.jks bestaat al"
            return
        }

        def storePass = System.getenv("SIGNING_STORE_PASSWORD") ?: "changeit"
        def keyPass = System.getenv("SIGNING_KEY_PASSWORD") ?: storePass
        def alias = System.getenv("SIGNING_KEY_ALIAS") ?: "upload"

        services.get(ExecOperations).exec {
            commandLine "keytool", "-genkeypair",
                    "-v", "-keystore", keystoreFile.absolutePath,
                    "-storepass", storePass,
                    "-keypass", keyPass,
                    "-alias", alias,
                    "-keyalg", "RSA", "-keysize", "2048",
                    "-validity", "36500",
                    "-dname", "CN=Android,O=App,C=NL"
        }
        println "keystore.jks aangemaakt"
    }
}

tasks.register("installGitHooks", Copy) {
    from new File(rootProject.rootDir, "scripts/pre-commit")
    into new File(rootProject.rootDir, ".git/hooks")
    fileMode 0775
}

// Automatically install git hooks after project evaluation
afterEvaluate {
    tasks.named("installGitHooks")
}

wrapper {
    gradleVersion = libs.versions.gradle.get()
    distributionType = "all"
}
