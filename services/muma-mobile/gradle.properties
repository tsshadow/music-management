org.gradle.parallel=true
org.gradle.daemon=true
# configureondemand is deprecated and incompatible with the configuration cache
# enabled below; the configuration cache subsumes what it used to buy us.
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
# The Kotlin compile daemon is a separate JVM and does NOT inherit the heap
# above; without this it runs on its default (much smaller) heap and spends the
# build in GC.
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC

kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.incremental.usePreciseJavaTracking=true

android.useAndroidX=true
android.enableJetifier=false

# This properties enables transitive Resource classes, which decreases build time,
# but could lead to problems referencing Resources. Set them to false if needed.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# DataBinding (the reason this used to be off) is disabled project-wide now:
# no layout in the project ever used a <layout> root, only viewBinding.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# TODO Renable on day (check that Retrofit, Jackson, and Imageloader are working)
android.enableR8.fullMode=true

# JetBrains AI Assistant configuration
# Enabling this helps the IDE's AI features better index the project context
ai.assistant.enabled=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
