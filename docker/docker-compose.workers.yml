version: "3.9"

services:
  importer_worker:
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_IMPORTER}:latest
    container_name: muma-importer-worker
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/importer/importer_service.py",
        "--repeat",
        "--sleeptime",
        "300"
      ]
    environment:
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "${dryrun:-False}"
      rescan: "True"
      delimiter: "${delimiter}"
      import_folder_path: ${import_folder_path}
      eps_folder_path: ${eps_folder_path}
      music_folder_path: ${music_folder_path}
      youtube_folder: ${youtube_folder}
      youtube_video_folder: ${youtube_video_folder}
      youtube_archive: ${youtube_archive}
      youtube_accounts: ${youtube_accounts}
      soundcloud_folder: ${soundcloud_folder}
      soundcloud_archive: ${soundcloud_archive}
      soundcloud_accounts: ${soundcloud_accounts}
      ffmpeg_location: /usr/local/bin 
      ffmpeg-location: /usr/local/bin
      telegram_folder: ${telegram_folder}
      ytdlp: yt-dlp
      telegram_api_id: "${telegram_api_id}"
      telegram_api_hash: "${telegram_api_hash}"
      telegram_session: ${telegram_session}
      DB_HOST: ${DB_HOST}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
      ask-for-missing: "false"
      NOTIFY_URL: ${NOTIFY_URL}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

  youtube_worker:
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_DOWNLOADER}:latest
    container_name: muma-youtube-worker
    # A deploy sends SIGTERM and then SIGKILL. The worker aborts its download and
    # writes down what the pass learned within a second or two, so this is
    # headroom rather than a wait -- shutdown does not take longer for it.
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "youtube",
        "--repeat",
        "--break-on-existing"
      ]
    environment:
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "${dryrun:-False}"
      rescan: "True"
      delimiter: "${delimiter}"
      import_folder_path: ${import_folder_path}
      eps_folder_path: ${eps_folder_path}
      music_folder_path: ${music_folder_path}
      youtube_folder: ${youtube_folder}
      youtube_video_folder: ${youtube_video_folder}
      youtube_archive: ${youtube_archive}
      youtube_accounts: ${youtube_accounts}
      soundcloud_folder: ${soundcloud_folder}
      soundcloud_archive: ${soundcloud_archive}
      soundcloud_accounts: ${soundcloud_accounts}
      ffmpeg_location: /usr/local/bin
      ffmpeg-location: /usr/local/bin
      telegram_folder: ${telegram_folder}
      ytdlp: yt-dlp
      telegram_api_id: "${telegram_api_id}"
      telegram_api_hash: "${telegram_api_hash}"
      telegram_session: ${telegram_session}
      DB_HOST: ${DB_HOST}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
      ask-for-missing: "false"
      YT_COOKIES: "firefox:/firefox-config/profile"
      NOTIFY_URL: ${NOTIFY_URL}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
      - ${HOST_DATA_PATH}/firefox:/firefox-config:ro
    networks:
      - music-management_db

  soundcloud_worker:
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_DOWNLOADER}:latest
    container_name: muma-soundcloud-worker
    # A deploy sends SIGTERM and then SIGKILL. The worker aborts its download and
    # writes down what the pass learned within a second or two, so this is
    # headroom rather than a wait -- shutdown does not take longer for it.
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "soundcloud",
        "--repeat",
        "--break-on-existing"
      ]
    environment:
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "${dryrun:-False}"
      rescan: "True"
      delimiter: "${delimiter}"
      import_folder_path: ${import_folder_path}
      eps_folder_path: ${eps_folder_path}
      music_folder_path: ${music_folder_path}
      youtube_folder: ${youtube_folder}
      youtube_video_folder: ${youtube_video_folder}
      youtube_archive: ${youtube_archive}
      youtube_accounts: ${youtube_accounts}
      soundcloud_folder: ${soundcloud_folder}
      soundcloud_archive: ${soundcloud_archive}
      soundcloud_accounts: ${soundcloud_accounts}
      ffmpeg_location: /usr/local/bin
      ffmpeg-location: /usr/local/bin
      telegram_folder: ${telegram_folder}
      ytdlp: yt-dlp
      telegram_api_id: "${telegram_api_id}"
      telegram_api_hash: "${telegram_api_hash}"
      telegram_session: ${telegram_session}
      DB_HOST: ${DB_HOST}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
      ask-for-missing: "false"
      soundcloud_cookies: "firefox:/firefox-config/profile"
      NOTIFY_URL: ${NOTIFY_URL}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
      - ${HOST_DATA_PATH}/firefox:/firefox-config:ro
    networks:
      - music-management_db

  telegram_worker:
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TELEGRAM}:latest
    container_name: muma-telegram-worker
    restart: unless-stopped
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "telegram",
        "--repeat"
      ]
    environment:
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "${dryrun:-False}"
      delimiter: "${delimiter}"
      music_folder_path: ${music_folder_path}
      telegram_folder: ${telegram_folder}
      telegram_api_id: "${telegram_api_id}"
      telegram_api_hash: "${telegram_api_hash}"
      telegram_session: ${telegram_session}
      telegram_accounts: "${telegram_accounts}" 
      DB_HOST: ${DB_HOST}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DB: ${DB_DB}
      NOTIFY_URL: ${NOTIFY_URL}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db  
    stdin_open: true
    tty: true


networks:
  music-management_db:
    external: true
