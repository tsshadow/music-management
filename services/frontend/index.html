<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- `viewport-fit=cover` is what puts the WebView behind the phone's system bars: without it
             Capacitor's SystemBars plugin pads the WebView by the bar insets and the bars keep the
             WebView's own background (a grey the app never chose) instead of the app's. With it
             `env(safe-area-inset-*)` carries the real insets and the surfaces below pad themselves. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>MuMa</title>
        <!-- The boot screen (docs/designs/perceived-performance/, styleguide "Boot screen"). Inline,
             because it has to paint before any stylesheet or script of the bundle has loaded --
             that wait is exactly what it covers. `src/lib/bootScreen.js` drives it once the bundle
             runs and removes it after the app has mounted. -->
        <style>
            html,
            body {
                background: #191414;
            }
            #boot-screen {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                background: #191414;
                color: #b3b3b3;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
                    sans-serif;
                transition: opacity 200ms ease-in-out;
            }
            #boot-screen.boot-leaving {
                opacity: 0;
                pointer-events: none;
            }
            #boot-screen .boot-stage {
                font-size: 14px;
                min-height: 20px;
                margin: 0;
            }
            #boot-screen .boot-hint {
                font-size: 12px;
                color: #727272;
                min-height: 16px;
                margin: 0;
            }
            #boot-screen .boot-track {
                position: relative;
                width: 160px;
                height: 3px;
                border-radius: 9999px;
                background: #2f2f2f;
                overflow: hidden;
            }
            #boot-screen .boot-bar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                width: 40%;
                border-radius: 9999px;
                background: #1db954;
                animation: boot-slide 1.2s ease-in-out infinite;
            }
            #boot-screen .boot-bar.boot-determinate {
                animation: none;
                transition: width 200ms ease-in-out;
            }
            #boot-screen .boot-retry {
                display: none;
                margin-top: 8px;
                background: transparent;
                border: 1px solid #727272;
                color: #fff;
                padding: 8px 32px;
                border-radius: 24px;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
            }
            #boot-screen.boot-stuck .boot-retry {
                display: block;
            }
            /* The server-unreachable panel (src/lib/bootUnreachable.js, styleguide "Boot screen:
               server unreachable"): it takes the place of the stage line and the bar. */
            #boot-screen.boot-choosing .boot-stage,
            #boot-screen.boot-choosing .boot-track,
            #boot-screen.boot-choosing .boot-hint,
            #boot-screen.boot-choosing .boot-retry {
                display: none;
            }
            #boot-screen .boot-choice {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                max-width: 320px;
                padding: 0 24px;
                text-align: center;
            }
            #boot-screen .boot-choice-title {
                margin: 0;
                color: #fff;
                font-size: 18px;
                font-weight: 700;
            }
            #boot-screen .boot-choice-body {
                margin: 0;
                font-size: 14px;
            }
            #boot-screen .boot-choice-status {
                margin: 0;
                min-height: 16px;
                color: #727272;
                font-size: 12px;
            }
            #boot-screen .boot-choice-actions {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                width: 100%;
                margin-top: 8px;
            }
            #boot-screen .boot-pill {
                min-height: 48px;
                background: transparent;
                border: 1px solid #727272;
                color: #fff;
                padding: 8px 32px;
                border-radius: 24px;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
            }
            #boot-screen .boot-pill-primary {
                background: #fff;
                border-color: #fff;
                color: #000;
            }
            #boot-screen .boot-pill:disabled {
                opacity: 0.5;
                cursor: default;
            }
            #boot-screen .boot-pill[hidden] {
                display: none;
            }
            @keyframes boot-slide {
                from {
                    transform: translateX(-100%);
                }
                to {
                    transform: translateX(250%);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #boot-screen .boot-bar {
                    animation: none;
                    width: 100%;
                    opacity: 0.6;
                }
            }
        </style>
    </head>
    <body>
        <div id="boot-screen" role="status" aria-live="polite">
            <svg viewBox="0 0 512 512" width="72" height="72" aria-hidden="true">
                <circle cx="256" cy="256" r="256" fill="#1DB954" />
                <g fill="none" stroke="#121212" stroke-width="36" stroke-linecap="round">
                    <path d="M132 177 V335" />
                    <path d="M194 227 V335" />
                    <path d="M256 275 V335" />
                    <path d="M318 227 V335" />
                    <path d="M380 177 V335" />
                </g>
            </svg>
            <p class="boot-stage" data-boot-stage></p>
            <div class="boot-track"><div class="boot-bar" data-boot-bar></div></div>
            <p class="boot-hint" data-boot-hint></p>
            <button type="button" class="boot-retry" data-boot-retry></button>
        </div>
        <div id="app"></div>
        <script>
            // Before the bundle: the first line in the listener's language (the key i18n/index.js
            // stores), and a way out if the app never appears. Plain ES5 on purpose -- this is the
            // one piece that has to work when the bundle itself does not.
            (function () {
                var screen = document.getElementById("boot-screen");
                if (!screen) return;
                var english = false;
                try {
                    var stored = JSON.parse(localStorage.getItem("muma_locale") || "null");
                    english = stored ? stored === "en" : !/^nl/i.test(navigator.language || "");
                } catch (e) {
                    english = false;
                }
                screen.querySelector("[data-boot-stage]").textContent = english ? "Loading…" : "Laden…";
                var retry = screen.querySelector("[data-boot-retry]");
                retry.textContent = english ? "Try again" : "Opnieuw proberen";
                retry.onclick = function () {
                    location.reload();
                };
                window.__mumaBootTimer = setTimeout(function () {
                    if (!window.__mumaBootDone) screen.className += " boot-stuck";
                }, 20000);
            })();
        </script>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
