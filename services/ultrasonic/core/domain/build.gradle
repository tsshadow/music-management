plugins {
    alias libs.plugins.ksp
}

apply from: bootstrap.androidModule

dependencies {
    implementation libs.core
    implementation libs.roomRuntime
    implementation libs.roomKtx
    ksp libs.room
}
android {
    namespace = 'org.moire.ultrasonic.domain'
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    // This module is pure domain logic with no UI layouts, and must stay
    // platform-independent (see ArchitectureTest). Data/view binding would
    // generate a DataBinderMapperImpl class directly in this module's
    // namespace package, which would violate that rule by depending on
    // android.* types.
    buildFeatures {
        dataBinding = false
        viewBinding = false
    }

    ksp {
        arg("ksp.jvmTarget", "21") // Ensure KSP targets JVM 21
    }
}

android {
    sourceSets["main"].java.srcDirs("src/main/kotlin")
}