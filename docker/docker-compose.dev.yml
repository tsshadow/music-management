# LOCAL ONLY. The last overlay scripts/dev.sh layers on top of docker-compose.yml,
# docker-compose.workers.yml and docker-compose.tools.yml: it bind-mounts the checkout's
# services/ into the Python containers so a code change needs a restart, not a rebuild.
#
# An overlay only states what differs. `image` and `security_opt` come from
# docker-compose.yml; repeating `security_opt` here made compose 2.26 (what the
# workstation runs) refuse the merged list as "array items must be unique".
# LMS is not in this stack at all -- it is its own stack,
# services/music-management-server/docker-compose.yml -- so this file cannot add
# anything to it: a `music-management-server` entry here (the frontend dist mount)
# was a service with neither image nor build and stopped the whole render.
# tests/ci/test_compose_render.py renders this combination.
version: "3.9"

# Every service logs through json-file with rotation. Docker's default is
# json-file *without* a size cap, so a chatty container grows its log under
# /var/lib/docker until the disk is full -- and on the production host a full
# disk has already looked like an unrelated 502 (nginx logs just stop). 3 x 10 MB
# per container is plenty for `docker logs`; the event log is the real history.
# Same values as docker/docker-compose.yml; tests/ci/test_compose_log_rotation.py
# checks that every service in every compose file has a logging block.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  music-manager:
    logging: *default-logging
    volumes:
      - ../services:/app/services
  importer_worker:
    logging: *default-logging
    volumes:
      - ../services:/app/services
  youtube_worker:
    logging: *default-logging
    volumes:
      - ../services:/app/services
  soundcloud_worker:
    logging: *default-logging
    volumes:
      - ../services:/app/services
  telegram_worker:
    logging: *default-logging
    volumes:
      - ../services:/app/services
