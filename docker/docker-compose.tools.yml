version: "3.9"

# Renders only on top of docker-compose.yml (its services depend on `db`). The three
# services that file already defines -- soundcloud-fetcher, genre-processor, firefox --
# take `image` and `security_opt` from it rather than repeating them: a second
# `no-new-privileges:true` made compose 2.26 reject the merged list as "array items
# must be unique". tests/ci/test_compose_render.py renders the combination.

# Every service logs through json-file with rotation. Docker's default is
# json-file *without* a size cap, so a chatty container grows its log under
# /var/lib/docker until the disk is full -- and on the production host a full
# disk has already looked like an unrelated 502 (nginx logs just stop). 3 x 10 MB
# per container is plenty for `docker logs`; the event log is the real history.
# Same values as docker/docker-compose.yml; tests/ci/test_compose_log_rotation.py
# checks that every service in every compose file has a logging block.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  soundcloud-fetcher:
    logging: *default-logging
    container_name: muma-soundcloud-fetcher
    depends_on:
      - db
    command: ["python", "tools/soundcloud_fetcher.py"]
    environment:
      - PYTHONPATH=/app
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_DB=${DB_DB}
      - music_folder_path=${music_folder_path}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

  # Eenmalige run, geen daemon: `docker-compose -f ... run --rm release-date-backfill`.
  # Het standaardcommando is de dry run, want deze schrijft tags in de hele
  # bibliotheek. Draai eerst `--check`: dat meldt welke bestanden niet te
  # schrijven zijn voordat er iets geschreven wordt, en dat is precies waar de
  # vorige poging op stukliep.
  release-date-backfill:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TOOLS}:latest
    container_name: muma-release-date-backfill
    depends_on:
      - db
    command: ["python", "scripts/backfill_release_dates.py"]
    restart: "no"
    # One-shot run; same ceiling as the one-shots in docker-compose.yml.
    mem_limit: ${MUMA_MEM_LIMIT_ONESHOT:-1g}
    environment:
      - PYTHONPATH=/app
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_DB=${DB_DB}
      - music_folder_path=${music_folder_path}
      - eps_folder_path=${eps_folder_path}
      - delimiter=${delimiter}
    volumes:
      - ${HOST_MUSIC_PATH}:/mnt/music
    networks:
      - music-management_db

  # Eenmalige run, geen daemon: `docker-compose -f ... run --rm song-work-repair`.
  # Het standaardcommando is de dry run, want dit maakt de groepering van tracks
  # los die de worker daarna opnieuw indeelt. Draai hem pas als de code die de
  # sleutel repareert draait en migrate_v19 langs de database is geweest: tegen de
  # oude code levert hij exact dezelfde foute groepering weer op. Schrijven doet
  # `... run --rm song-work-repair python scripts/repair_song_works.py`.
  song-work-repair:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TOOLS}:latest
    container_name: muma-song-work-repair
    depends_on:
      - db
    command: ["python", "scripts/repair_song_works.py", "--dry-run"]
    restart: "no"
    # One-shot run; same ceiling as the one-shots in docker-compose.yml.
    mem_limit: ${MUMA_MEM_LIMIT_ONESHOT:-1g}
    environment:
      - PYTHONPATH=/app
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_DB=${DB_DB}
    networks:
      - music-management_db

  genre-processor:
    logging: *default-logging
    container_name: genre-processor
    depends_on:
      - db
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_DB=${DB_DB}
    stdin_open: true
    tty: true
    networks:
      - music-management_db
#
#  Deprecated and disabled since 2026-09-25, kept commented: see services/ml-analyzer/DEPRECATED.md
#  ml-analyzer:
#    image: ${DOCKER_USER}/${IMAGE_ML}:latest
#    container_name: muma-ml-analyzer
#    depends_on:
#      - db
#    environment:
#      - DB_HOST=${DB_HOST}
#      - DB_PORT=${DB_PORT}
#      - DB_USER=${DB_USER}
#      - DB_PASS=${DB_PASS}
#      - DB_DB=${DB_DB}
#      - PYTHONPATH=/app
#    volumes:
#      - ${HOST_MUSIC_PATH}:/mnt/music
#      - ${HOST_DATA_PATH}/shared:/shared
#    networks:
#      - music-management_db

  firefox:
    logging: *default-logging
    container_name: muma-firefox
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      TZ: Europe/Amsterdam
      WEB_AUTHENTICATION: "1"
      SECURE_CONNECTION: "1"
      DISABLE_GPU: "1"
      WEB_AUTHENTICATION_USERNAME: ${FIREFOX_USER:-admin}
      # No default: it was "admin", on a port bound on every interface.
      WEB_AUTHENTICATION_PASSWORD: ${FIREFOX_PASSWORD}
    ports:
      - "7003:5800"
    volumes:
      - ${HOST_DATA_PATH}/firefox:/config
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

networks:
  music-management_db:
    external: true
