/**
 * This module provides a base for for pure kotlin modules
 */
apply plugin: 'kotlin'
apply plugin: 'com.google.devtools.ksp'
apply from: "${project.rootDir}/gradle_scripts/code_quality.gradle"

// Note: the JVM target for all Kotlin compile tasks (including this module's) is already
// set globally in the root build.gradle's `allprojects { tasks.withType(KotlinCompile) ... }`
// block. The Java side has no such global default: without this, compileJava targets
// whatever JDK runs the Gradle daemon (e.g. 25 when Android Studio pins one via
// gradle-daemon-jvm.properties) and Kotlin's JVM-target validation fails the build.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    main.java.srcDirs += "${projectDir}/src/main/kotlin"
    test.java.srcDirs += "${projectDir}/src/test/kotlin"
    test.java.srcDirs += "${projectDir}/src/integrationTest/kotlin"
    test.resources.srcDirs += "${projectDir}/src/integrationTest/resources"
}

dependencies {
    api libs.kotlinStdlib

    testImplementation libs.junit
    testRuntimeOnly libs.junitVintage
    testRuntimeOnly libs.junitPlatformLauncher
}

tasks.named("test").configure {
    useJUnitPlatform()
}

tasks.register("ciTest") {
    dependsOn test
    group = "Verification"
    description = "Special task for CI that calls all tests in pure kotlin modules"
}
