version: "3.9"

# De backupjobs staan bewust niet in docker-compose.tools.yml.
#
# Die file heeft `depends_on: db`, en `db` staat in docker-compose.core.yml.
# docker-compose v1 valideert het hele bestand voordat het één service start, dus
# `run --rm db-backup` op de tools-file sterft op
# "Service 'soundcloud-fetcher' depends on service 'db' which is undefined" --
# een fout die niets met de backup te maken heeft. De systemd-timers draaien dit
# bestand standalone, dus het moet op zichzelf kloppen.
#
# Een depends_on is hier ook niet nodig: beide jobs verbinden over het externe
# netwerk music-management_db en falen luid als de database er niet is.

# Every service logs through json-file with rotation. Docker's default is
# json-file *without* a size cap, so a chatty container grows its log under
# /var/lib/docker until the disk is full -- and on the production host a full
# disk has already looked like an unrelated 502 (nginx logs just stop). 3 x 10 MB
# per container is plenty for `docker logs`; the event log is the real history.
# Same values as docker/docker-compose.yml; tests/ci/test_compose_log_rotation.py
# checks that every service in every compose file has a logging block.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Beide draaien one-shot, aangestuurd door de systemd-timers in
  # scripts/backup/systemd/. Geen restart-policy: een backup die na een fout
  # meteen opnieuw begint, doet dat zonder dat iemand de fout gezien heeft.
  #
  # NOTIFY_URL moet hier expliciet mee: het alarm is de enige reden dat deze
  # jobs iets terugmelden, en de tools-compose gaf hem tot nu toe niet door.
  db-backup:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TOOLS}:latest
    container_name: muma-db-backup
    restart: "no"
    # Watchtower must leave these alone: it replaces a running container whose
    # image has a newer :latest with a fresh copy under the same name, and a
    # fresh copy of a dump job starts a second dump beside the first. That is
    # how a pre-deploy backup broke on 2026-09-27 (bug report 123).
    labels:
      - com.centurylinklabs.watchtower.enable=false
    # Python streams mariadb-dump/mariadb through gzip in chunks; neither holds
    # the dump in memory. The server-side work lands in `db`, not here. 512m.
    mem_limit: ${MUMA_MEM_LIMIT_BACKUP:-512m}
    # Anders dan de langlopende services hierboven staat de root hier wel
    # read-only. Deze twee schrijven maar op twee plekken: het
    # --defaults-extra-file met de credentials in /tmp, en de dumps op de
    # gemounte /backups. Mocht dat toch te krap blijken, dan meldt het zich:
    # de systemd-unit faalt en /health/backup verloopt binnen 36 uur.
    read_only: true
    tmpfs:
      - /tmp
    command: ["python", "tools/db_backup.py"]
    environment:
      - PYTHONPATH=/app
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_DB=${DB_DB}
      - BACKUP_DB_USER=${BACKUP_DB_USER:-}
      - BACKUP_DB_PASS=${BACKUP_DB_PASS:-}
      - BACKUP_PATH=/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - BACKUP_STALE_AFTER_HOURS=${BACKUP_STALE_AFTER_HOURS:-36}
      - NOTIFY_URL=${NOTIFY_URL}
    volumes:
      - ${HOST_BACKUP_PATH:-/mnt/backups/muma}:/backups
      - ${HOST_DATA_PATH}/importer:/app/data
    networks:
      - music-management_db

  db-restore-check:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TOOLS}:latest
    container_name: muma-db-restore-check
    restart: "no"
    # Watchtower must leave these alone: it replaces a running container whose
    # image has a newer :latest with a fresh copy under the same name, and a
    # fresh copy of a dump job starts a second dump beside the first. That is
    # how a pre-deploy backup broke on 2026-09-27 (bug report 123).
    labels:
      - com.centurylinklabs.watchtower.enable=false
    # Python streams mariadb-dump/mariadb through gzip in chunks; neither holds
    # the dump in memory. The server-side work lands in `db`, not here. 512m.
    mem_limit: ${MUMA_MEM_LIMIT_BACKUP:-512m}
    # Anders dan de langlopende services hierboven staat de root hier wel
    # read-only. Deze twee schrijven maar op twee plekken: het
    # --defaults-extra-file met de credentials in /tmp, en de dumps op de
    # gemounte /backups. Mocht dat toch te krap blijken, dan meldt het zich:
    # de systemd-unit faalt en /health/backup verloopt binnen 36 uur.
    read_only: true
    tmpfs:
      - /tmp
    command: ["python", "tools/db_restore_check.py"]
    environment:
      - PYTHONPATH=/app
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_DB=${DB_DB}
      - BACKUP_DB_USER=${BACKUP_DB_USER:-}
      - BACKUP_DB_PASS=${BACKUP_DB_PASS:-}
      # Alleen-lezen: de check hoeft niets aan de backups te veranderen, en een
      # herstelproef die zijn eigen bronbestand kan overschrijven is geen proef.
      - BACKUP_PATH=/backups
      - NOTIFY_URL=${NOTIFY_URL}
      # The daily music mirror check (muma-music-mirror-check.service) runs in this
      # service too: it needs the same read-only /backups, the database and ntfy.
      - MIRROR_STATUS_PATH=${MIRROR_STATUS_PATH:-}
      - MIRROR_STALE_AFTER_HOURS=${MIRROR_STALE_AFTER_HOURS:-36}
    volumes:
      - ${HOST_BACKUP_PATH:-/mnt/backups/muma}:/backups:ro
      - ${HOST_DATA_PATH}/importer:/app/data
    networks:
      - music-management_db

networks:
  music-management_db:
    external: true
