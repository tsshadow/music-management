version: "3.9"

# Every service logs through json-file with rotation. Docker's default is
# json-file *without* a size cap, so a chatty container grows its log under
# /var/lib/docker until the disk is full -- and on the production host a full
# disk has already looked like an unrelated 502 (nginx logs just stop). 3 x 10 MB
# per container is plenty for `docker logs`; the event log is the real history.
# Same values as docker/docker-compose.yml; tests/ci/test_compose_log_rotation.py
# checks that every service in every compose file has a logging block.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: mariadb:13.0.2@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
    container_name: music-management-db-1
    restart: unless-stopped
    # MariaDB 11.5 changed the server default to utf8mb4_uca1400_ai_ci, and the
    # 10.10 -> 12.3 migration inherited it: the restored tables kept their own
    # utf8mb4_general_ci, but anything created afterwards would not. A join
    # between the two raises "Illegal mix of collations", which surfaces on the
    # first new table rather than on the upgrade that caused it. Pinned to what
    # the data already is; moving the whole schema to uca1400 is a separate,
    # deliberate job because it changes uniqueness semantics.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_DB}
    ports:
      # Loopback unless opted in, as in docker-compose.yml (see the comment there).
      - "${DB_BIND_ADDRESS:-127.0.0.1}:3306:3306"
    volumes:
      - ${HOST_DATA_PATH}/mariadb:/var/lib/mysql
    networks:
      - music-management_db

  phpmyadmin:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    image: phpmyadmin:5.2.3@sha256:fb0cb638f7d1c2529407921d86679b2b2faf5bb8542314821e9f16e7e3d2954f
    container_name: music-management-phpmyadmin-1
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_BIND_ADDRESS:-127.0.0.1}:8002:80"
    networks:
      - music-management_db

  # Consolidated Music Manager Service
  music-manager:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    build:
      context: ..
      dockerfile: Dockerfile.music-manager
    container_name: music-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8003:8000" # Compatibility for old control-center port if needed
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_DB=${DB_DB}
      - PHPMYADMIN_URL=${PHPMYADMIN_URL}
      - API_KEY=${API_KEY}
      - AUTH_SERVICE_URL=http://music-manager:8000
      - LMS_HOSTS=${LMS_HOSTS}
      - LMS_SUBSONIC_API_KEY=${LMS_SUBSONIC_API_KEY}
      - PUBLIC_SOURCE_URL=${PUBLIC_SOURCE_URL:-https://github.com/OWNER/music-management}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /docker/lms/var/lms:/app/data:rw
      - ${HOST_MUSIC_PATH}:/mnt/music:ro
    networks:
      - music-management_db

networks:
  music-management_db:
    name: music-management_db
    driver: bridge
