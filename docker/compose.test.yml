# docker/compose.test.yml
#
# Test-only compose file (Task 3 / Phase 1.2 of the test plan).
#
# This file is intentionally separate from docker-compose.yml / docker-compose.core.yml:
# - only temporary databases, temporary volumes and disposable test credentials;
# - never mounts real music/library paths or production data;
# - every image is built from the current checkout (no ":latest" prebuilt pulls);
# - includes healthchecks so dependents only start once a service is actually ready.
#
# Usage: see scripts/test/core-smoke.sh
#
# NOTE: services/music-management-server (LMS) itself has no HTTP health endpoint yet
# (see docs/testing-inventory.md, open question). The healthcheck below uses the
# Subsonic "ping" endpoint, which requires the server to be fully initialized to respond.

# Every service logs through json-file with rotation. Docker's default is
# json-file *without* a size cap, so a chatty container grows its log under
# /var/lib/docker until the disk is full -- and on the production host a full
# disk has already looked like an unrelated 502 (nginx logs just stop). 3 x 10 MB
# per container is plenty for `docker logs`; the event log is the real history.
# Same values as docker/docker-compose.yml; tests/ci/test_compose_log_rotation.py
# checks that every service in every compose file has a logging block.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  test-db:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Same hardening as `db` in docker/docker-compose.yml (issue #32), so the
    # suites that run against this stack prove the entrypoint still starts.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 1024
    image: mariadb:13.0.2@sha256:d4fdec0510ad498e4f3127da30a99df3745bd6d5e611ae6ac5f76403d9284a8d
    # Same pin as the production compose files: without it CI runs on MariaDB
    # 12's utf8mb4_uca1400_ai_ci default while production runs
    # utf8mb4_general_ci, so a collation mismatch would pass here and fail there.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: test-root-password
      MYSQL_USER: muma_test
      MYSQL_PASSWORD: muma_test
      MYSQL_DATABASE: muma_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - muma-test

  music-manager:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Same hardening as music-manager in docker/docker-compose.yml (issue #32).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
    pids_limit: 1024
    build:
      context: ..
      dockerfile: docker/Dockerfile.music-manager
    depends_on:
      test-db:
        condition: service_healthy
      # music-manager opens LMS's lms.db directly (see the lms-data mount below), and its
      # startup threads -- the lms.db sync, the listen backfill -- read it the moment they
      # start. Waiting for LMS makes that moment deterministic: the file exists, LMS has
      # applied its migrations and switched it to WAL, and LMS created the volume, so the
      # directory and every file in it carry LMS's non-root owner rather than root's.
      # LMS itself does not need music-manager to become healthy (its healthcheck is an
      # unauthenticated ping), so this is not a cycle.
      music-management-server:
        condition: service_healthy
    environment:
      DB_HOST: test-db
      DB_PORT: "3306"
      DB_USER: muma_test
      DB_PASS: muma_test
      DB_DB: muma_test
      API_KEY: test-api-key
      AUTH_SERVICE_URL: http://music-manager:8000
      PYTHONPATH: /app
      # Points music-manager at the test LMS instance so a new admin/user is
      # pushed to it immediately after setup (see notify_server_sync_users()).
      MUMA_SERVER_HOSTS: music-management-server:5082
      # Shared with the LMS container's /music via the "shared-music" volume
      # below, so both services' scanners see the exact same fixture files
      # (music-manager's own scanner keeps a separate library_tracks table
      # used for scrobble matching, see routers/scrobbler.py).
      music_folder_path: /mnt/music
      # The same three-level shape production runs: label releases live under
      # <music>/EPs/<label>/<cat id - release>/, and the import queue is a folder
      # inside that tree. Both used to be /mnt/music flat, which made every file on
      # the volume look like a label release to the tagger -- including the generic
      # fixture under "Top 100" -- and left the folder layout the label chain reads
      # its publisher and catalogue number out of untested end to end.
      import_folder_path: /mnt/music/EPs/__TODO
      eps_folder_path: /mnt/music/EPs
      # The background tagger round runs once at startup (before the fixture exists)
      # and then every TAGGER_SLEEPTIME seconds. The e2e suite tags the fixture
      # explicitly and, in one feature, marks it for a retag it then runs itself; a
      # round firing on its own in between would rewrite the file under the streaming
      # assertions. A day keeps it out of every run.
      TAGGER_SLEEPTIME: "86400"
    tmpfs:
      - /app/data
    volumes:
      - shared-music:/mnt/music
      # LMS's own database directory, at the path production mounts it
      # (docker/docker-compose.yml: `${LMS_DATA_PATH}/var/lms:/app/data/stable`), so
      # `routers.users.lms_db_targets()` finds `/app/data/stable/lms.db` under the default
      # MUMA_SERVER_DB_ROOT exactly as it does there. Without it GET /api/auth/subsonic-token
      # answered 503 in this stack and the hourly lms.db sync never ran (issue #74). The
      # volume is the disposable lms-data one below, never a real path; the nested mount
      # lands inside the /app/data tmpfs the same way production's lands inside its bind.
      - lms-data:/app/data/stable
    ports:
      - "${MUMA_TEST_PORT_MANAGER:-18000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - muma-test

  music-management-server:
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Same hardening as lms in services/music-management-server/docker-compose.yml
    # (issue #32), including the read-only root filesystem.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
    read_only: true
    tmpfs:
      - /tmp:size=64m
    pids_limit: 1024
    build:
      context: ..
      dockerfile: services/music-management-server/Dockerfile-release
    depends_on:
      test-db:
        condition: service_healthy
    # NOTE: /var/lms is NOT a tmpfs mount here: LMS runs as a non-root user
    # (muma-server, chown'd by the image at build time) and a tmpfs mount would
    # reset ownership to root, causing "Permission denied" on startup.
    # An anonymous volume inherits the image's ownership instead and is still
    # fully temporary/disposable (removed by `docker compose down -v`).
    volumes:
      - lms-data:/var/lms
      - shared-music:/music
    environment:
      # Delegates auth to the test music-manager (see MusicManagementPasswordService
      # and UserSynchronizer): users/passwords are never stored locally in LMS.
      LMS_API_KEY: test-api-key
      # NOTE: must include the "/api" prefix, consistent with production
      # docker-compose.yml: all music-management-server backends (auth,
      # scrobbling, feedback/rating) append their own sub-path directly onto
      # this base URL.
      LMS_MUSIC_MANAGEMENT_URL: http://music-manager:8000/api
      LMS_MUSIC_MANAGEMENT_API_KEY: test-api-key
      # As in the lms stack: music-manager's portrait folder, kept on every scan (bug report 139).
      LMS_ARTIST_IMAGE_MANAGED_DIRECTORY: /music/artists
    ports:
      - "${MUMA_TEST_PORT_LMS:-15082}:5082"
    healthcheck:
      # NOTE: use 127.0.0.1, not "localhost": in this Alpine image "localhost"
      # resolves to ::1 first and LMS does not appear to accept IPv6 connections
      # even with listen-addr = 0.0.0.0, causing "Connection refused" with wget.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5082/rest/ping.view"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - muma-test

networks:
  muma-test:
    driver: bridge

volumes:
  # Named (but disposable) volumes: removed entirely by `docker compose down -v`,
  # never shared with the production docker-compose.yml volumes/paths.
  # Also mounted into music-manager at /app/data/stable, as production does.
  lms-data:
  # Shared between LMS (/music) and music-manager (/mnt/music) so a fixture
  # file copied once is visible to both services' independent scanners.
  shared-music:
