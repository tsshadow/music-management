# GitLab CI pipeline (Task 8 of the test plan).
#
# Only wires up commands that are already verified to work locally via the
# scripts under scripts/test/ (see AGENTS.md -> "Full test inventory & local
# commands" and docs/testing-inventory.md). CI must never be the place where a
# script is tried for the first time: run it locally first, then add it here.
#
# Requires a Linux GitLab Runner with Docker + Docker Compose available
# (shell or docker executor with access to the host's Docker daemon).

default:
  interruptible: true
  hooks:
    # Safety net only. The MuMa Mobile jobs used to build inside a root-running
    # Android SDK container and hand the workspace back via an EXIT trap; a hard
    # kill of the runner host - reboot, LXC stop, OOM - skipped that trap and
    # left root-owned Gradle output behind, which broke the *next* job in
    # get_sources ("Permission denied" on git clean) before any script in this
    # file could run.
    #
    # Since docker/Dockerfile-android-ci those containers run as the runner's
    # own uid, so this should never find anything. Keep it until no runner has a
    # pre-existing root-owned workspace; if it ever logs its warning again,
    # something started running as root again and that is the bug to fix.
    pre_get_sources_script:
      - |
        if [ -d "$CI_PROJECT_DIR" ] && [ -n "$(find "$CI_PROJECT_DIR" ! -user "$(id -u)" -print -quit 2>/dev/null)" ]; then
          echo "WARNING: reclaiming files not owned by $(id -un) in $CI_PROJECT_DIR - something ran as root"
          docker run --rm -v "$CI_PROJECT_DIR:/workspace" alpine chown -R "$(id -u):$(id -g)" /workspace
        fi

# Which pipelines exist at all. Without this, every job whose rules are
# `changes:`-only also matches merge_request_event, so a push to a branch that
# has an open merge request creates a branch pipeline *and* an MR pipeline for
# the same commit and runs the entire suite twice. The workaround for the
# resulting Gradle cache collision is still visible in
# scripts/test/muma-mobile-unit.sh.
#
# Feature branches get merge request pipelines only. A branch pipeline for
# them used to be allowed as long as no MR was open yet -- which is exactly
# the state of every branch's *first* push, seconds before `glab mr create`.
# On that first push GitLab has no CI_COMMIT_BEFORE_SHA, evaluates every
# `changes:` rule as true, and runs the entire file: muma:images, server:lint,
# mobile:smoke, everything (feature/muma-gate-queue, pipeline 3203: 27 jobs, 66
# job minutes for an 11-file frontend change). The MR pipeline that followed
# ran the 13 jobs the diff actually touched. Eleven of the sixty pipelines
# before this change were such first pushes. A push to a feature branch that
# has no MR now runs nothing; opening the MR is what starts CI.
workflow:
  rules:
    # Release and hotfix branches always get their own branch pipeline, even
    # while an MR is open for them. muma:deploy, release:version-check and
    # friends all match on $CI_COMMIT_BRANCH, which is unset in a merge request
    # pipeline -- so if the duplicate-pipeline guard below applied here, the
    # release would simply never be deployed.
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
    # ...and because they get a branch pipeline, they must NOT also get a merge
    # request pipeline. The push-vs-MR dedupe below keys on
    # $CI_OPEN_MERGE_REQUESTS, which is only set in *push* pipelines -- so a
    # release branch with an open MR used to run everything twice, and the two
    # Android jobs raced each other for the shared Gradle home (one of them
    # died on a vanished Gradle cache during the 0.23.x releases). The branch
    # pipeline is the one muma:deploy lives in, so it is the one that stays.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^(release|hotfix)\//'
      when: never
    # Scheduled pipelines (security:dependency-audit) always run.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Merge request pipelines: the only way a feature branch is tested.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # A pipeline started by hand (Run pipeline, or the API) on any branch,
    # e.g. MUMA_UPDATE_SNAPSHOTS=1 to refresh the frontend:e2e references.
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    # The two long-lived branches. Nothing else gets a branch pipeline.
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'

stages:
  - quality
  - unit
  - integration
  - e2e
  - release
  - deploy
  # Last on purpose, and nothing is ever placed after it: this stage exists so
  # that the jobs in it cannot gate anything. See security:dependency-audit.
  - audit

# --- Job naming ---------------------------------------------------------------
# Every job is `<scope>:<what>`. Enforced by tests/ci/test_gitlab_ci_policy.py,
# which also checks that no component is missing one of the core checks.
#
# The scope is the **source component** -- what you edited -- which is the same
# thing the `changes:` rules key on:
#
#   backend    the Python tree: music_manager, importer, downloader, tagger,
#              scanner, common, tools. 384 files, five shipped images. Called
#              backend rather than manager because music_manager is 96 of those
#              files; the rest are its workers and shared code.
#   server     the C++ playback server (services/music-management-server)
#   frontend   the Svelte web UI. Not a deployable of its own: it is built in
#              the first stage of the server's Dockerfile-release and ends up
#              inside that image, under its web docroot.
#   mobile     the Android app
#
# `backend` and `server` are both server-side, so to be explicit: `server` is
# the C++ playback/streaming server, `backend` is everything Python. The
# toolchains tell them apart at a glance -- server:format is clang-format,
# backend:format is ruff.
#
# Every component answers the same three questions -- format, lint, unit --
# with component-specific extras where they genuinely exist (backend:typecheck
# is mypy, mobile:smoke boots an APK on an emulator). Forcing perfect symmetry
# would mean inventing empty jobs.
#
# Two other scopes:
#
#   muma       spans components, or is the whole product: muma:contracts,
#              muma:e2e, muma:smoke, muma:images, muma:deploy, muma:verify
#   security, deps, runner, release
#              concerns that belong to no component. `release` stays its own
#              scope because those seven jobs are a sequence you read together.

# Referenced by the quality and unit jobs, which gate a production deploy via
# stage ordering. Those jobs also have `changes:` rules, which is what keeps
# ordinary feature pushes cheap -- but on a release/hotfix branch the last
# commit usually touches only VERSION, CHANGELOG.md and RELEASE_NOTES.md, so
# `changes:` alone would skip them, and a skipped job does not block
# muma:deploy. This rule makes them unconditional exactly where it matters.
#
# Deliberately NOT referenced by backend:integration, muma:contracts, muma:smoke and
# frontend:e2e: those run unconditionally on every develop push, and a
# release branch is develop plus a VERSION/CHANGELOG commit, so re-running them
# on the stabilize commit would re-test an already-tested tree for ~30 minutes
# of wall clock. A release commit that changes actual code trips their
# `changes:` rules like any other commit. The list of jobs that must reference
# this anchor is pinned in tests/ci/test_gitlab_ci_policy.py (GATING_JOBS).
#
# That skip only holds if the release branch already exists on the remote when
# the stabilize commit is pushed. On the *first* push of a new branch GitLab
# has no CI_COMMIT_BEFORE_SHA and evaluates every `changes:` rule as true, so
# a release cut-and-push in one go ran muma:images, server:lint and all of the
# above anyway (release/0.65.2, pipeline 3211: ~24 job minutes on the two
# biggest alone). The muma-release skill therefore pushes the empty branch
# first with `-o ci.skip` and the stabilize commit second.
.release_rule:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'

# Referenced first by every job that a dedicated schedule must not drag in.
#
# GitLab treats `changes:` as always true in a scheduled pipeline. Every job
# whose rule is a `changes:` list therefore matches unconditionally there, so a
# schedule created to run one job runs the entire suite -- and on master, where
# `$CI_COMMIT_BRANCH == "master"` also holds, that included release:tag and
# release:back-merge-develop, which re-ran every week from the downloader
# refresh (see pipeline 1119).
#
# The two schedule variables are the whole mechanism: a schedule sets exactly
# one of them, the job that schedule exists for is the only one that does not
# reference this guard, and everything else steps aside. A new dedicated
# schedule means a new variable here and a new exemption in
# tests/ci/test_gitlab_ci_policy.py.
.dedicated_schedule_guard:
  rules:
    - if: '$RENOVATE == "true" || $REFRESH_DOWNLOADER == "true" || $DISK_JANITOR == "true"'
      when: never

# Referenced by every job that is not part of the release sequence.
#
# A push to master is the merge of a release/hotfix branch whose tip already
# passed the full gated pipeline, and the merge commit's tree is identical to
# that tip: master receives nothing else. Yet the `changes:` rules see the
# whole release as the diff and re-ran backend:*, server:*, backend:integration
# and muma:contracts on it (pipeline 3200: 20 job minutes) -- and because
# release:tag sits in a later stage, the tag and the back-merge waited for all
# of it. On master only release:* runs. Scoped to push pipelines so the
# scheduled jobs that live on master (muma:refresh-downloader) are unaffected.
.not_on_master:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
      when: never

# Retried only where the code under test never got a fair run. Retrying a
# script_failure would turn a flaky test green and hide it.
.infra_retry:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# node_modules keyed on the lockfile: a cold checkout otherwise re-runs
# `npm install` from scratch (see scripts/test/frontend-unit.sh).
.npm_cache:
  cache:
    key:
      files:
        - services/frontend/package-lock.json
    paths:
      - services/frontend/node_modules/

# Jobs that may run on either CI host, so two of them can run at once.
#
# There are two runners and both carry the `fast` tag: the always-on LXC
# (the CI LXC runner, which also picks up untagged jobs) and the owner's
# workstation runner, which is tagged-only and often powered off.
# GitLab hands a `fast` job to whichever runner polls first, so tagging a job
# here buys parallelism when the workstation is up and changes nothing when it
# is not -- the LXC still carries the same tag, so nothing ever queues waiting
# for a machine that is asleep.
#
# Only add a job here when its whole environment travels with it -- a Docker
# image, or a compose file this repo owns. The two hosts do not run the same
# toolchain (LXC: Python 3.11, node 24; workstation: Python 3.13, node 20), so
# a job that calls `python3 -m pytest` or `npm` against the host would report a
# different result depending on which runner happened to poll first. That is a
# coin flip dressed as a gate, and it is why frontend:* and frontend:e2e
# (`npx playwright` on the host) stay untagged and LXC-only. backend:unit and
# backend:integration used to be in that group and are not any more: since bug
# report 050 they run pytest inside docker/Dockerfile.python-ci, an image
# tooling_use_ci_image builds on whichever host runs the job (tagged with the
# Dockerfile hash and the runner's uid, never pulled), so the interpreter and
# the packages are the same on both. The throwaway MariaDB of
# backend:integration is named after CI_JOB_ID and published on a
# Docker-assigned loopback port, so two of them on one host never meet
# (GitLab issue #27; both were watched green on the workstation there).
# Starting containers is not the test: muma:contracts starts a compose stack
# in Docker and then runs `python3 -m pytest` against it from the host, so it
# stays in the untagged group. It and backend:integration were once tagged on
# the strength of a `docker` line in their script and failed in 5 seconds on
# the workstation with `No module named pytest` (pipeline 2618).
# muma:e2e looks identical and is not: core-e2e.sh falls back to running the
# feature inside its own image when pytest-bdd is missing.
# The workstation also has an unrelated Qt binary at /usr/bin/vite, which has
# already eaten a quarter of an hour of a frontend build once.
#
# Tagging the Docker-based jobs is mostly about memory, not speed. The LXC
# shares node `server` with gitlab (15G cap) and lms (11.9G cap, sitting at
# it), and the CT memory caps there add up to 58G on 30G of RAM. Every mobile:*
# and muma:* job handed to the workstation is a Gradle or compose stack that
# does not run next to GitLab itself.
#
# Deploy and release jobs must never carry this tag: they hold the production
# SSH key and push tags, and neither belongs on a desktop. mobile:build-release
# is out for the same reason -- it signs and uploads the APK.
.fast_runner:
  tags:
    - fast

# --- Static analysis ---------------------------------------------------------
# Runs the same scripts the pre-commit hook runs, so a commit made with
# --no-verify, or through the GitLab web UI, still meets the same bar. Both the
# ruff rule set and the pylint threshold live in the repo (pyproject.toml,
# .pylintrc) rather than in this file.
#
# format and lint are separate jobs on purpose. "Run the formatter" and "fix a
# lint finding" are very different amounts of work, and bundling them reports
# both as one red box.

.backend_paths: &backend_paths
        - services/**/*.py
        - tools/**/*.py
        # Both scripts cover tests/ too, so a change there has to re-run them.
        - tests/**/*.py
        - scripts/**/*.sh
        - pyproject.toml
        - .pylintrc
        - .gitlab-ci.yml

backend:format:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  # scripts/format.sh re-runs itself in a container when ruff is missing.
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes: *backend_paths
  script:
    - ./scripts/format.sh --check

backend:lint:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  # scripts/lint.sh always runs inside the python:3.14 tooling container in CI
  # (tooling_container_required in scripts/lib/python-tooling.sh), so both
  # runners lint with the same interpreter the images run.
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes: *backend_paths
  script:
    - ./scripts/lint.sh

# Shell scripts. Gates at `warning`, no baseline -- see scripts/shellcheck.sh.
# Deploy, release and test scripts are the ones that
# break production quietly, and nothing else in the pipeline reads them.
muma:shellcheck:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes:
        - "**/*.sh"
        - .gitlab-ci.yml
  script:
    - ./scripts/shellcheck.sh

# The frontend reverse proxy decides which /muma paths LMS still owns and which
# go straight to MuMa. Nothing else exercises that config: the e2e stacks talk
# to LMS and MuMa directly. A wrong regex there looks fine everywhere but prod.
muma:proxy-routing:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes:
        - services/music-management-server/nginx/**/*
        - scripts/test/reverse-proxy-routing.sh
        - .gitlab-ci.yml
  script:
    - ./scripts/test/reverse-proxy-routing.sh

# Every merge request brings a changelog fragment, or says why not with a
# `no-changelog` label. The fragments exist because editing the shared
# `[Unreleased]` block merges cleanly *and wrongly* -- see changelog.d/README.md
# -- and they only pay for themselves if they are actually written.
muma:changelog:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - ./scripts/ci/changelog-fragment-check.sh

# C++ formatting for the MuMa Server. Its own job rather than a step in
# server:unit, which builds the whole server and takes up to 45 minutes:
# a formatting mistake should be reported in under a minute, not after a
# compile. .clang-format has been in that directory since the fork and was
# read by nothing, which left 37 of 870 files unformatted.
#
# This is the server's only static analysis. clang-tidy is the obvious next
# step and is a bigger job: it needs the compilation database, so it belongs
# with the build rather than here.
server:format:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes:
        - services/music-management-server/src/**/*
        - services/music-management-server/.clang-format
        - scripts/test/muma-server-format.sh
        - .gitlab-ci.yml
  script:
    - ./scripts/test/muma-server-format.sh

# clang-tidy over the same sources. Its own job rather than a step in
# server:format, which answers in under a minute: this one configures cmake
# and analyses 307 translation units, and took ~10 minutes at -j16 when it was
# wired. Keeping them apart means a misplaced brace is still reported fast.
#
# Findings are baselined (1540 of them on day one), so this is green today and
# red on anything new -- the contract detekt, Android Lint and semgrep already
# have here. The baseline names the checks worth burning down first.
#
# 45m, after its first CI run was killed at 30. The cause was memory rather
# than the wall -- see the parallelism block in scripts/test/muma-server-tidy.sh
# -- but the runner also has every other job of the pipeline on it, so the
# margin is worth having on a job that gates nothing downstream.
server:lint:
  stage: quality
  timeout: 45m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes:
        - services/music-management-server/src/**/*
        - services/music-management-server/CMakeLists.txt
        - services/music-management-server/.clang-tidy
        - security/accepted-clang-tidy-findings.txt
        - docker/Dockerfile-cpp-tidy
        - scripts/test/muma-server-tidy.sh
        - scripts/ci/clang_tidy_baseline.py
        - .gitlab-ci.yml
  script:
    - ./scripts/test/muma-server-tidy.sh

# Type checking, rolled out per module. pyproject.toml holds a loose floor for
# the whole tree plus a list of modules checked strictly; scripts/typecheck.sh
# runs that list. The list only ever grows -- cleaning a module up means fixing
# its findings and adding it there in the same merge request.
backend:typecheck:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  # Same tooling container as backend:lint, for mypy.
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes:
        - services/**/*.py
        - pyproject.toml
        - scripts/typecheck.sh
        - .gitlab-ci.yml
  script:
    - ./scripts/typecheck.sh

# The loose floor itself: mypy over services/ and tools/ with the [tool.mypy]
# settings every module is supposedly held to. backend:typecheck only runs the
# strict list, so nothing ever ran this -- and it could not even start, because
# tools/ was "found twice under different module names" (see scripts/typecheck.sh).
#
# A hard gate since its backlog reached zero (299 errors in 82 files when the job
# was added, GitLab issues #41 and #171). A new error fails the pipeline.
backend:typecheck-all:
  stage: quality
  timeout: 15m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - changes:
        - services/**/*.py
        - tools/**/*.py
        - pyproject.toml
        - scripts/typecheck.sh
        - .gitlab-ci.yml
  script:
    - ./scripts/typecheck.sh --all

# Dependency vulnerability scanning of the declared requirements and the
# frontend lockfile -- repository-controlled, so a finding always points at a
# line someone can change here. Runs on a schedule (so a newly published CVE
# surfaces without anyone pushing), on the default branch, and manually.
#
# allow_failure because it queries the advisory database over the network: a
# transient outage should not turn master red. Read the job log. Findings that
# genuinely cannot be fixed yet are listed, with a reason, in
# security/accepted-vulnerabilities.txt.
#
# It sits in the `audit` stage with `needs: []` rather than in `quality`, and
# the two halves of that are both load-bearing. `needs: []` frees it to start at
# the beginning of the pipeline instead of waiting for a stage boundary; the
# late stage means nothing waits for it to finish. It used to be a `quality`
# job, and on develop pipeline 1104 that held the entire unit stage for ten
# minutes -- five queued behind a busy runner, six running -- before a single
# test started, for a result that is `allow_failure` and gates nothing. A job
# whose outcome cannot block the pipeline should not be able to delay it either.
security:dependency-audit:
  stage: audit
  needs: []
  # 30m, not the 15m the pip/npm-only version had: the trivy sections generate
  # an Android SBOM (a Gradle run in the CI container) and pull image layers on
  # a cold cache. No resource_group despite the Gradle run -- the weekly 6am
  # schedule makes a collision with a muma-mobile job unlikely, and the shared
  # Gradle home survives concurrent use (file locks); serializing would let a
  # busy Monday pipeline delay a job that gates nothing.
  timeout: 30m
  interruptible: false
  allow_failure: true
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    # $RENOVATE excludes the renovate schedule: that pipeline exists to run one
    # job, and every schedule-triggered job would otherwise ride along with it.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE != "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
  script:
    - ./scripts/ci/dependency-audit.sh

# Static analysis. semgrep's curated `p/default` rules over the whole tree.
#
# Not allow_failure, unlike security:dependency-audit. That job is allow_failure
# because a new CVE can appear without anyone pushing, so its result is about
# the outside world; this one is about the diff in front of it, and a finding
# here is something the merge request introduced. The tree's existing 232
# findings are written down in security/accepted-sast-findings.txt with a reason
# per rule, so this is green today and goes red only on something new -- which
# is the only way a scanner stays worth reading.
#
# It does fetch its rules from semgrep's registry, so a registry outage fails
# the job. That is the same class of dependency as the container registry every
# other job already pulls from, and .infra_retry covers a blip.
security:sast:
  stage: quality
  timeout: 15m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes:
        - services/**/*
        - scripts/**/*
        - tools/**/*
        - docker/**/*
        - security/accepted-sast-findings.txt
        # semgrep reads renovate.json, so a change to it can add a finding --
        # and without this entry no pipeline would run the scan that catches
        # it, leaving develop red for the next unrelated merge request.
        - renovate.json
        - .gitlab-ci.yml
  script:
    - ./scripts/ci/sast.sh

# Committed-credential scan. allow_failure is deliberately absent: unlike the
# dependency audit, this one does not depend on a third-party service being
# reachable, so a failure here is a finding, not an outage. Path exemptions
# live in security/gitleaks.toml, per-finding ones in .gitleaksignore.
security:secret-scan:
  stage: quality
  # 30m, not 15m. A merge request now scans only its own commits and finishes
  # in seconds (see scripts/ci/secret-scan.sh), but develop, master, release
  # branches and the schedule still scan the whole history -- and that crossed
  # 20 minutes on 2026-09-01, when four whole-tree reformats landed inside the
  # runner's 20-commit shallow clone. It failed a release branch for a reason
  # that had nothing to do with the release.
  timeout: 30m
  retry: !reference [.infra_retry, retry]
  # gitleaks runs as a container; nothing is needed on the host.
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    # See security:dependency-audit for why the renovate schedule is excluded.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE != "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - "**/*"
  script:
    - ./scripts/ci/secret-scan.sh

# Runs Renovate against this repository. renovate.json has been in the tree
# since 0.24.0 and describes exactly which updates are grouped and which merge
# themselves -- but nothing ever executed it, so it produced no merge requests
# and no dependency dashboard. This job is the missing half.
#
# Self-hosted, because Mend's hosted GitLab app only serves gitlab.com and this
# instance is our own. The upstream renovate-runner CI template is the usual
# route, and it is unusable here twice over: on a self-hosted instance it has
# to be pulled in as a remote `include:` from gitlab.com on every pipeline, and
# the job it installs declares an `image:`, which this shell-executor runner
# never starts. scripts/ci/renovate.sh runs the container itself, the way
# secret-scan.sh and sast.sh do.
#
# Scheduled only, guarded by $RENOVATE so that an ordinary push can never start
# a bot that opens merge requests, and by $RENOVATE_TOKEN so the job disappears
# instead of failing on an instance where the token was never configured -- the
# same shape as muma:refresh-downloader. The schedule wants RENOVATE=true and
# should sit shortly before the `before 6am on monday` window in renovate.json;
# Renovate itself honours that window, so a schedule that fires outside it
# simply finds nothing to do.
#
# The token is a PAT with api, read_user and write_repository, set as a masked
# CI/CD variable. Its user is the author of every dependency merge request, and
# needs enough access to merge one for automerge to work at all.
#
# `needs: []` and the audit stage: same reasoning as security:dependency-audit
# -- nothing should wait on this, and it should not wait on a stage boundary.
deps:renovate:
  stage: audit
  needs: []
  timeout: 30m
  interruptible: false
  tags: !reference [.fast_runner, tags]
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true" && $RENOVATE_TOKEN'
  script:
    - ./scripts/ci/renovate.sh

# Reclaims disk on the runner before a full one breaks jobs that have nothing
# wrong with them. Three times in August the host filled up and the failures
# pointed everywhere but at the disk -- on 2026-08-31 three of four failed on
# "no matching files" during artifact upload. scripts/ci/disk-janitor.sh is the
# by-hand recipe from those incidents, made repeatable.
#
# Untagged on purpose, and that is the whole runner-selection mechanism: the
# always-on LXC picks up untagged jobs and the workstation is tagged-only, so
# this always lands on the host that actually fills up. The workstation is not
# reachable from a schedule at all (both runners share the `fast` tag, so
# tagging would be a coin flip) and gets the systemd timer in
# scripts/ci/systemd/ instead -- same script, so both hosts get the same
# age-filtered build-cache prune (72h, a 24h floor when still critical) that
# the workstation lacked when it hit 98% on 2026-09-25 (docs/bug-reports/073).
#
# Not allow_failure: the script exits non-zero only when it has swept
# everything it safely can and the disk is *still* critical, which is exactly
# the moment a human should hear about it. Everything else is a green log.
runner:disk-janitor:
  stage: audit
  needs: []
  timeout: 30m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DISK_JANITOR == "true"'
  script:
    - ./scripts/ci/disk-janitor.sh

# --- Unit tests -------------------------------------------------------------

backend:unit:
  stage: unit
  timeout: 20m
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes:
        - services/music_manager/**/*
        - services/importer/**/*
        - services/downloader/**/*
        - services/tagger/**/*
        - services/scanner/**/*
        - services/common/**/*
        # services/ml-analyzer is deprecated and deliberately absent: the unit
        # script skips its tests and pyproject.toml omits it from coverage, so
        # it cannot move this job's result. backend:ml-analyzer-unit below is its only
        # job (services/ml-analyzer/DEPRECATED.md).
        # A change to a test, or to a script a test covers, has to run the tests.
        - services/tests/**/*
        # The script also collects tools/, the pipeline policy suite and the
        # real-mutagen tests.
        - tools/**/*
        - tests/ci/**/*
        - tests/unit/**/*
        - scripts/**/*
        - pytest.ini
        # The suite runs in docker/Dockerfile.python-ci (python:3.14-slim, the
        # images' Python) with requirements.txt installed, cached per hash --
        # not on the runner's system python3. A change to either is a change
        # to the environment the tests run in.
        - requirements.txt
        - docker/Dockerfile.python-ci
        - .gitlab-ci.yml
  # Either runner: the suite runs in docker/Dockerfile.python-ci (see .fast_runner).
  tags: !reference [.fast_runner, tags]
  script:
    - ./scripts/test/music-management-unit.sh
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    # A test report that is only uploaded when the job succeeds is useless: the
    # run worth inspecting is the failed one.
    when: always
    reports:
      junit: report-python.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-python.xml

# The deprecated ml-analyzer's tests, out of the default pipeline since
# 2026-09-25 (services/ml-analyzer/DEPRECATED.md). Manual and allow_failure:
# the service does not run anywhere, so nothing waits on it; the button stays
# so the kept code can still be checked, and it only appears on a pipeline that
# touches the service or its tests. tests/ci/test_ml_analyzer_deprecated.py
# fails if any other job starts referencing services/ml-analyzer again.
# Reviving the service means turning this back into a gating job -- see the
# checklist in DEPRECATED.md.
backend:ml-analyzer-unit:
  stage: unit
  timeout: 15m
  allow_failure: true
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - changes:
        - services/ml-analyzer/**/*
        - services/tests/MlAnalyzer*Test.py
        - scripts/test/ml-analyzer-unit.sh
      when: manual
      allow_failure: true
  script:
    - ./scripts/test/ml-analyzer-unit.sh

server:unit:
  stage: unit
  timeout: 45m
  retry: !reference [.infra_retry, retry]
  # The whole build and test run happens inside Dockerfile-build-alpine, so this
  # needs only a Docker daemon. It is also the longest job in the pipeline, which
  # makes it the one worth handing to a spare 16-core host when there is one.
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes:
        - services/music-management-server/**/*
        - .gitlab-ci.yml
  script:
    - ./scripts/test/muma-server-unit.sh
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)\%/'
  artifacts:
    # when: always for the same reason the junit reports have it: the coverage
    # of the run worth inspecting is the coverage of the run that failed.
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-muma-server.xml

# The four frontend checks used to be one job running them in sequence. Split
# so the job name says which one broke, and because on two runners they can now
# run at once instead of end to end. The cost is a node_modules cache restore
# per job, which the .npm_cache key makes cheap.
.frontend_paths: &frontend_paths
        - services/frontend/**/*
        - .gitlab-ci.yml

frontend:format:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  cache: !reference [.npm_cache, cache]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes: *frontend_paths
  script:
    - ./scripts/test/frontend-unit.sh format

frontend:lint:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  cache: !reference [.npm_cache, cache]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes: *frontend_paths
  script:
    - ./scripts/test/frontend-unit.sh lint

frontend:typecheck:
  stage: quality
  timeout: 10m
  retry: !reference [.infra_retry, retry]
  cache: !reference [.npm_cache, cache]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes: *frontend_paths
  script:
    - ./scripts/test/frontend-unit.sh typecheck

frontend:unit:
  stage: unit
  timeout: 15m
  retry: !reference [.infra_retry, retry]
  cache: !reference [.npm_cache, cache]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes: *frontend_paths
  script:
    - ./scripts/test/frontend-unit.sh unit
  coverage: '/All files\s*\|\s*[\d\.]+\s*\|\s*[\d\.]+\s*\|\s*[\d\.]+\s*\|\s*([\d\.]+)/'
  artifacts:
    # See server:unit above.
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/frontend/coverage/cobertura-coverage.xml

# The web bundle the Android shell serves, built where Node exists.
#
# This is the first producer/consumer artifact edge in this pipeline, and it exists because the
# toolchains are split across two hosts: npm runs on the LXC, Gradle runs inside the Android image,
# and that image has no Node. GitLab moves the artifact between them; a shared /tmp path could not.
#
# It sits in `quality` so that every later stage inherits the artifact by default -- a job without
# `needs:` downloads from all earlier stages, which is how mobile:build-debug gets it without
# having its ordering changed. The two mobile jobs that do declare `needs:` name it explicitly,
# `optional: true` because this job has `changes:` rules and is frequently absent.
#
# Absent is a supported outcome, not a failure: `prepareWebBundle` in app/build.gradle writes a
# placeholder page when services/frontend/dist is missing, so a local build, a bare checkout and
# any pipeline without this job still assemble. Only the interface is missing, and it says so.
#
# The `changes:` list includes the mobile tree on purpose: a pipeline triggered by an Android
# change still ships an APK, and that APK should carry the real bundle rather than the placeholder.
frontend:bundle:
  stage: quality
  timeout: 15m
  retry: !reference [.infra_retry, retry]
  cache: !reference [.npm_cache, cache]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - services/frontend/**/*
        - services/muma-mobile/**/*
        - scripts/ci/frontend-bundle.sh
        - .gitlab-ci.yml
        # mobile:smoke's own triggers: without the bundle its APK carries the placeholder page,
        # and the check that the Capacitor plugins survived R8 has nothing to read.
        - docker/Dockerfile-android-ci
        - scripts/ci/android-image.sh
        - scripts/test/muma-mobile-emulator-smoke.sh
        - scripts/test/muma-mobile-emulator-smoke-inner.sh
        - scripts/ci/docker_disk_preflight.py
  script:
    - ./scripts/ci/frontend-bundle.sh
  artifacts:
    expire_in: 1 day
    paths:
      - services/frontend/dist/

# The Android checks, split by what they check like every other component.
#
# The cost here is real and worth stating, because it is the one place where
# this scheme is not free. All MuMa Mobile jobs share one Gradle home per runner
# (scripts/ci/android-gradle-home.sh) so that none starts from a cold
# dependency cache, and that is only safe while at most one runs at a time --
# which is what the resource group guarantees, project-wide, so it also covers
# two pipelines landing on the same runner. Splitting therefore buys no
# parallelism the way the frontend split does: these three still run one after
# another, and each now pays its own checkout and container start, about two
# minutes over the pipeline.
#
# Bought with it: the job name says whether formatting, a linter or a test
# failed, and one of them can be retried without re-running the other two.
.mobile_paths: &mobile_paths
        - services/muma-mobile/**/*
        # The image these jobs build in. A change to it went untested by
        # anything: no other job's rules mention it either.
        - docker/Dockerfile-android-ci
        - scripts/ci/android-image.sh
        - .gitlab-ci.yml

# The resource group above only holds while the job's container dies with the
# job. It did not: on a shell executor the runner kills the job's shell, and a
# foreground `docker run` left behind keeps running -- with a Gradle daemon
# holding /gradle_home/caches/journal-1/journal-1.lock. Job 30995 (mobile:unit,
# release/0.65.2) timed out at 22:46, its container ran on for an hour, and
# every mobile job that landed on that runner meanwhile died in 60 seconds
# with "Timeout waiting to lock journal cache": four jobs in three pipelines,
# none of them at fault.
#
# Every mobile script therefore labels its container `ci.job=$CI_JOB_ID`, and
# this after_script removes whatever still carries the label. after_script
# runs on cancel by default; on *timeout* it only runs if the runner stopped
# the script itself first, which is what RUNNER_SCRIPT_TIMEOUT (must be below
# the job's timeout) and RUNNER_AFTER_SCRIPT_TIMEOUT arrange.
.mobile_container:
  after_script:
    - docker ps -q --filter "label=ci.job=$CI_JOB_ID" | xargs -r docker rm -f

mobile:format:
  stage: quality
  resource_group: muma-mobile
  timeout: 20m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 18m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes: *mobile_paths
  script:
    - ./scripts/test/muma-mobile-ktlint.sh
  after_script: !reference [.mobile_container, after_script]

# detekt and Android Lint together: both are linters, they share a Gradle
# invocation cost, and neither has a fix-it-for-me command the way ktlint does.
mobile:lint:
  stage: quality
  resource_group: muma-mobile
  timeout: 20m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 18m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes: *mobile_paths
  script:
    - ./scripts/test/muma-mobile-detekt.sh
    # Android Lint sees manifest/resource/API-level problems detekt cannot.
    # Baselined like detekt: green on the day it was wired, red on new findings.
    - ./scripts/test/muma-mobile-lint.sh
  after_script: !reference [.mobile_container, after_script]

mobile:unit:
  stage: unit
  resource_group: muma-mobile
  # 20m, not the 45m this used to have. The old wall was set when three Android
  # jobs could run at once and starve each other; the resource group above ended
  # that. 45m only ever bought a hung Gradle daemon three quarters of an hour
  # before .infra_retry could react. Queue time waiting for the resource group
  # does not count against this.
  timeout: 20m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 18m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes: *mobile_paths
  script:
    - ./scripts/test/muma-mobile-unit.sh
  after_script: !reference [.mobile_container, after_script]
  coverage: '/Total.*?(\d+(?:\.\d+)?\%)/'
  artifacts:
    when: always
    reports:
      junit: services/muma-mobile/**/build/test-results/**/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: cobertura-muma-mobile.xml

# Runs first, in the very first stage, so a release pipeline fails fast (before
# any image is built) if a required deployment secret (e.g. GOOGLE_CLIENT_ID)
# is missing -- see scripts/ci/check-required-secrets.sh for the rationale.
# GitLab has no built-in way to require a key inside a file-type CI/CD
# variable to be set, so this job IS that requirement (AGENTS.md rule 1/10):
# a release pipeline that skips or ignores this job is not considered passing.
release:check-secrets:
  stage: unit
  timeout: 5m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
  script:
    - ./scripts/ci/check-required-secrets.sh

# Runs every endpoint's SQL against a real MariaDB. The unit suite mocks the
# database cursor, so it can only prove the right SQL string was produced -- a
# column that does not exist, or a table the schema bootstrap never creates,
# passes there and fails in production. This job is what caught the missing
# downloads_youtube_accounts.channel_id and library_track_ml_labels.updated_at
# columns. It also applies every migrate_*.sql twice, so a migration that is not
# re-runnable fails here rather than on deploy.
# The three jobs below declare `needs:` instead of waiting for the whole unit
# stage. Nothing here depends on the Android build, but stage ordering made them
# wait for it anyway: on the 0.19.0 release pipeline the Android jobs ran for
# 37 minutes and every integration job sat behind it, for a result none of them
# used. `optional: true` on every entry is load-bearing - each upstream job has
# `changes:` rules, so it is frequently not in the pipeline at all, and a
# non-optional need on an absent job is a pipeline-level YAML error, not a skip.
backend:integration:
  stage: integration
  timeout: 30m
  retry: !reference [.infra_retry, retry]
  needs:
    - job: backend:unit
      optional: true
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - services/music_manager/**/*
        - services/common/db_init.py
        # The other places a table is declared (tests/integration/schema_sources.py
        # reads them all): the downloader's own tables and the tagger's.
        - services/downloader/db_schema.py
        - services/common/Helpers/ProcessedFilesHelper.py
        - migrate_*.sql
        - tests/integration/**/*
        - .gitlab-ci.yml
        # A job has to run when the script it runs changes. Without this line a
        # merge request that only edits scripts/test/db-integration.sh is
        # reviewed and merged without ever executing it.
        - scripts/test/db-integration.sh
        # pytest runs inside the same container as backend:unit.
        - scripts/lib/python-tooling.sh
        - scripts/lib/python-tooling-install.sh
        - requirements.txt
        - docker/Dockerfile.python-ci
  # Either runner: pytest runs in docker/Dockerfile.python-ci and the database
  # is per job (see .fast_runner).
  tags: !reference [.fast_runner, tags]
  script:
    - ./scripts/test/db-integration.sh

# --- Integration / contract tests -------------------------------------------
# These build and start docker/compose.test.yml from a clean state, so they
# always run on the default branch, and on any merge request that touches
# something the test stack itself depends on.

muma:contracts:
  stage: integration
  timeout: 30m
  retry: !reference [.infra_retry, retry]
  needs:
    - job: backend:unit
      optional: true
    - job: server:unit
      optional: true
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - services/music-management-server/**/*
        - services/music_manager/**/*
        - docker/compose.test.yml
        - tests/fixtures/**/*
        - tests/contracts/**/*
        - .gitlab-ci.yml
        # Same reason as backend:integration above.
        - scripts/test/contracts.sh
  script:
    - ./scripts/test/contracts.sh

# --- Docker image builds -----------------------------------------------------
# Until these two jobs existed, a merge request that changed nothing but a
# Dockerfile matched no `changes:` rule anywhere in this file and ran zero jobs
# beyond the secret scan. The first thing that ever built those images was
# release:build-images, on a release branch, minutes before muma:deploy.
#
# They are split because they cost very different amounts. muma:smoke starts
# the stack and proves it comes up healthy, but compose.test.yml only builds
# music-manager and lms. muma:images compiles all seven, which is the
# only way to cover base/downloader/telegram/importer/tools, and takes about as
# long as the release build does.

muma:smoke:
  stage: integration
  timeout: 30m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  needs: []
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    # One rule, no `if`: it matches every branch, so a separate default-branch
    # variant of the same `changes:` list was a strict subset and never decided
    # anything.
    - changes:
        - docker/**/*
        - services/music-management-server/Dockerfile-release
        - scripts/test/core-smoke.sh
  script:
    - ./scripts/test/core-smoke.sh

muma:images:
  stage: integration
  timeout: 60m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  needs: []
  # PUSH_IMAGES=false is what makes this safe to run on a merge request: it
  # builds every image release:build-images builds and pushes none of them, so
  # it needs no Docker Hub credentials and cannot publish anything.
  variables:
    PUSH_IMAGES: "false"
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    # Deliberately not gated on .gitlab-ci.yml: this is the most expensive job
    # in the file, and every edit to this file would otherwise trigger a full
    # seven-image build for a change that cannot affect one.
    - changes:
        - docker/Dockerfile*
        - services/music-management-server/Dockerfile-release
        - scripts/ci/build-and-push-images.sh
  script:
    - ./scripts/ci/build-and-push-images.sh

# --- Browser end-to-end ------------------------------------------------------

# A track goes in one end and comes out as a listen at the other: scan the
# fixture into the library, ask for it over the Subsonic API the way the mobile
# app does, scrobble it, and see the listen match. Every other suite proves one
# component in isolation; this is the only one that proves the chain.
#
# It was manual on the assumption that it was expensive. It is not: the whole
# job is about 35 seconds, most of that the image build, because the stack is
# three containers over an empty database and the fixture is a single track. So
# it runs on every pipeline and it gates, like every other test here. The
# compose project name carries CI_JOB_ID and both ports are picked free at
# runtime, so two pipelines running it at once do not collide the way
# backend:integration used to, and core-e2e.sh removes its images on the way out
# rather than leaving a pair per run on the runner's disk.
#
# The chain is written as Gherkin: tests/bdd/features/scan_to_listen.feature,
# with pytest-bdd steps under it. It ran for a while as a manual pilot beside a
# plain pytest function saying the same thing, and won on one point -- the places
# where the coverage is thinner than the name suggests are stated between the
# steps, in the same document as the claims. The plain version and the pilot job
# are both gone, which was the deal: keeping two spellings of one chain means
# keeping them in sync forever.
#
# What it does NOT cover: the Android app -- that is mobile:smoke
# below, which executes the R8-minified build this chain never touches.
muma:e2e:
  stage: e2e
  timeout: 30m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  needs: []
  script:
    - ./scripts/test/core-e2e.sh
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - when: on_success

# Boots the R8-minified release APK on a headless ATD emulator (KVM) and
# verifies the app survives startup. The 6.21.0 crash (docs/bug-reports/029)
# existed only in the minified build -- a Gson TypeToken R8 had stripped -- so
# every other Android job was structurally blind to it and the first execution
# was a user's phone. A tripwire, not a UI suite: install, then launch twice
# (first start, cold restart after force-stop), and each time: process alive
# after 15s, no FATAL EXCEPTION/ANR, CapacitorActivity resumed, and the login
# page showing the static server -- a value that only arrives through a
# Capacitor plugin call R8 can strip without crashing anything. Signed with a
# throwaway keystore; the real key never leaves mobile:build-release. Details:
# docs/testing-inventory.md (muma-mobile).
#
# Deliberately not gated on .gitlab-ci.yml (same reasoning as
# muma:images): an emulator boot is the most expensive thing in the
# muma-mobile resource group, and a yml-only edit cannot change what it proves.
mobile:smoke:
  stage: e2e
  resource_group: muma-mobile
  timeout: 30m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 28m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  # Needs nothing from the host but Docker, git and /dev/kvm - and both `fast`
  # hosts have KVM (the LXC via the 2026-08-22 passthrough, the workstation
  # natively, where this script was developed). The emulator boot is among the
  # heaviest jobs here, so the 32GB workstation taking it when awake is exactly
  # what the tag is for.
  tags: !reference [.fast_runner, tags]
  retry: !reference [.infra_retry, retry]
  # After the unit tests, not in parallel with them: both jobs queue on the
  # same resource group anyway, and letting the emulator grab the slot first
  # would delay the fast feedback for a result that matters less.
  needs:
    - job: mobile:unit
      optional: true
    # This job builds a release APK too, so it wants the real bundle when there is one.
    - job: frontend:bundle
      optional: true
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - !reference [.release_rule, rules]
    - changes:
        - services/muma-mobile/**/*
        - docker/Dockerfile-android-ci
        - scripts/ci/android-image.sh
        - scripts/test/muma-mobile-emulator-smoke.sh
        - scripts/test/muma-mobile-emulator-smoke-inner.sh
        - scripts/ci/docker_disk_preflight.py
  script:
    - ./scripts/test/muma-mobile-emulator-smoke.sh
  after_script: !reference [.mobile_container, after_script]

frontend:e2e:
  stage: e2e
  timeout: 30m
  retry: !reference [.infra_retry, retry]
  cache: !reference [.npm_cache, cache]
  needs:
    - job: frontend:unit
      optional: true
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # A pipeline started by hand to refresh the reference screenshots
    # (docs/frontend-screenshots.md) has no changed files to match on.
    - if: '$MUMA_UPDATE_SNAPSHOTS == "1"'
    - changes:
        - services/frontend/**/*
        - docker/compose.test.yml
        - tests/fixtures/**/*
        - .gitlab-ci.yml
        # Same reason as backend:integration above.
        - scripts/test/frontend-browser.sh
  script:
    - ./scripts/test/frontend-browser.sh
  # 42 is the script's own code for "only the screenshot suite differs from
  # its references" (tests/browser/screenshots.spec.js): the job turns orange,
  # the pipeline goes on, and the diff sits in the artifacts to be judged. A
  # functional failure still exits 1 and blocks. Deliberately soft for now --
  # the suite is new and the flake rate on this runner unknown; drop this
  # once a few releases have gone by without a false diff.
  allow_failure:
    exit_codes: [42]
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - services/frontend/test-results/
      # The reference screenshots, as taken by this run: after
      # MUMA_UPDATE_SNAPSHOTS=1 this is where the refreshed set comes from,
      # and on a first run for a new route the only copy of its reference.
      - services/frontend/tests/browser/__screenshots__/
    # Without this, a Playwright failure is only visible by scrolling the raw
    # log -- every other suite here already reports into the GitLab test tab.
    reports:
      junit: services/frontend/test-results/junit-browser.xml

# --- Release stabilization ---------------------------------------------------
# Branch model: feature/* -> develop (integration) -> release/x.y.z
# (stabilization + prod deploy) -> master (tagged production record).
# See docs/release-management.md for the full policy.

release:version-check:
  stage: release
  timeout: 5m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
  script:
    - ./scripts/ci/release-version-check.sh

# Pushes :${VERSION} and :rc, never :latest (or :stable for lms): Watchtower on
# the host pulls :latest, so pushing it here let a release's code start before
# muma:deploy had migrated, or ship with no deploy at all. muma:deploy moves
# :latest after the backup and the migrations (scripts/ci/promote-release-images.sh).
release:build-images:
  stage: release
  timeout: 60m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\// && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
  script:
    - ./scripts/ci/build-and-push-images.sh

# Rebuilds the muma-base family from master between releases so production picks
# up a newer yt-dlp. yt-dlp ships fixes for SoundCloud/YouTube changes within
# days, while our images are otherwise only ever built on a release/* branch --
# which is how downloads stop working without anything here having changed.
#
# The name is narrower than the job: it rebuilds the base and everything built
# FROM it (downloader, telegram, importer), because the base is what carries the
# Debian security packages and rebuilding it alone leaves the others behind. The
# job name and REFRESH_DOWNLOADER are unchanged on purpose -- the GitLab schedule
# sets that variable, and renaming it stops the schedule silently.
#
# Runs only from a GitLab schedule with REFRESH_DOWNLOADER set, and only on
# master, so the image published as :latest is built from the commit production
# is already running. It does not deploy: Watchtower pulls :latest on the host.
muma:refresh-downloader:
  stage: release
  timeout: 60m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $REFRESH_DOWNLOADER == "true" && $CI_COMMIT_BRANCH == "master" && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
  script:
    - ./scripts/ci/refresh-downloader-image.sh

mobile:build-debug:
  stage: release
  resource_group: muma-mobile
  timeout: 45m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 43m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  retry: !reference [.infra_retry, retry]
  tags: !reference [.fast_runner, tags]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    # Manual on develop too: the universal-UI (Capacitor) work touches
    # services/muma-mobile/** on nearly every commit while it's in flight, and
    # an automatic build here would spend the ~45m Gradle/Docker build and push
    # a fresh APK to the debug series on every single one of them. Pressing the
    # button when a test build is actually wanted keeps that cost opt-in. This
    # only changes *when* the job runs -- the debug series it uploads to
    # (UpdateChecker's BuildConfig.DEBUG branch) and mobile:build-release's own
    # rules are untouched, so the release series a phone in production polls
    # can never receive one of these builds.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $APK_HOSTER_URL'
      changes:
        - services/muma-mobile/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
    # Same manual opt-in for merge request / feature branches: lets a reviewer
    # build and upload a debug APK for a specific MR (e.g. to test a UI fix
    # against prod before merging) without doing it for every push on every
    # branch.
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $APK_HOSTER_URL'
      changes:
        - services/muma-mobile/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - ./scripts/ci/muma-mobile-build-upload.sh debug
  after_script: !reference [.mobile_container, after_script]

mobile:build-release:
  stage: release
  resource_group: muma-mobile
  timeout: 45m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 43m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  # A new push to the release branch must not cancel an APK upload halfway;
  # every other job that publishes something already carries this.
  interruptible: false
  retry: !reference [.infra_retry, retry]
  # version-check because a wrongly-versioned APK must never reach the hoster,
  # and mobile:unit because `needs` bypasses stage ordering: without it
  # this job built and UPLOADED a signed APK even when the unit tests on the
  # same commit failed -- phones auto-update from the hoster, so that shipped
  # untested code to users while muma:deploy (correctly) never ran. The
  # resource group only serializes the two jobs, it does not order them.
  # optional: true satisfies the DAG policy (mobile:unit has `changes:`
  # rules); on a release branch .release_rule makes it always present.
  needs:
    - release:version-check
    - job: mobile:unit
      optional: true
    # Same reasoning, one stage earlier: the smoke test executes the exact
    # artifact class this job publishes, so a release APK that crashes on
    # startup must never reach the hoster. On a release branch .release_rule
    # makes it always present.
    - job: mobile:smoke
      optional: true
    # The APK that ships. Optional because frontend:bundle carries `changes:` rules like
    # everything else here, and a non-optional need on an absent job drops the whole pipeline;
    # without it the build falls back to the placeholder page rather than failing.
    - job: frontend:bundle
      optional: true
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\// && $APK_HOSTER_URL && $SIGNING_STORE_FILE'
  script:
    - ./scripts/ci/muma-mobile-build-upload.sh release
  after_script: !reference [.mobile_container, after_script]
  # The shipped APK is R8-minified; this mapping is the only way to read a
  # stacktrace it produces. Kept without expiry because a crash report can
  # arrive long after the next release replaced the APK on the hoster.
  artifacts:
    paths:
      - services/muma-mobile/dist/*-mapping.txt
    expire_in: never

# --- Deployment --------------------------------------------------------------

# Order inside the job (scripts/deploy.sh): database up and ready, verified
# pre-deploy dump, migrations, :latest promoted, then pull + up of what changed,
# then scripts/ci/post-deploy-verify.sh. See
# docs/bug-reports/050-deploy-starts-new-code-before-migrations.md.
muma:deploy:
  stage: deploy
  # 60m, not 30m: the pre-deploy dump of a ~780 MB (compressed) database, the
  # promotion of eight image tags and the verify step's settle minute all come
  # on top of what the job used to do.
  timeout: 60m
  interruptible: false
  # Deliberately no `retry:`. A deploy that failed halfway has already changed
  # the host; repeating it automatically hides which half succeeded.
  # Only one production deploy at a time. Two release pipelines overlapping is
  # exactly how bug-report 016 happened: a delayed pipeline on an already-merged
  # release branch re-pushed old images as `latest` and redeployed them. Set the
  # process mode of this resource group to "newest first" in
  # Settings > CI/CD > Resource groups, so a queued older pipeline is dropped
  # rather than applied after the newer one.
  resource_group: production
  environment:
    name: production
    url: $PROD_URL
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
  script:
    - ./scripts/ci-deploy.sh

# The independent read of whether the deploy worked. ci-deploy.sh runs the same
# script at its own last step, so a broken deploy fails muma:deploy itself; this
# job re-runs it afterwards for two reasons. It is retryable where muma:deploy
# deliberately is not, so a probe that timed out is distinguishable from a
# deploy that broke production. And it can be re-run on its own later to ask
# "is prod still healthy" without redeploying anything.
muma:verify:
  stage: deploy
  timeout: 15m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  needs:
    - muma:deploy
  environment:
    name: production
    url: $PROD_URL
    action: verify
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - !reference [.not_on_master, rules]
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
  script:
    - ./scripts/ci/post-deploy-verify.sh

# Guards release:tag below. Release 0.19.0 was tagged on master and back-merged
# to develop while production stayed on 0.18.2 for a day: mobile:unit
# failed on the release branch, so muma:deploy was *skipped*, and a skipped job
# blocks nothing. Every signal in GitLab said it had shipped.
#
# muma:verify cannot catch that, because it lives inside the pipeline that
# never ran. This job runs in the master pipeline and asks production directly.
release:verify-deployed:
  stage: release
  timeout: 10m
  interruptible: false
  needs: []
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - ./scripts/ci/verify-prod-version.sh

release:tag:
  stage: deploy
  timeout: 10m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  # `needs` rather than stage order, so tagging waits for the one check that
  # says something new and not for a re-run of the unit suite. This commit was
  # already tested on the release branch and is already in production; on the
  # 0.19.0 master pipeline the wait was 8.7 minutes, 6.7 of it the Android jobs
  # re-testing an unchanged tree. Those jobs still run and still red the
  # pipeline - they just no longer hold the tag.
  needs:
    - release:verify-deployed
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - ./scripts/ci/create-release-tags.sh

# Deleting the merged release/* branch depends on nothing but the merge to
# master having happened, so it needs nothing. It used to be the tail of
# back-merge-develop.sh, which made it conditional on release:tag - and
# therefore, since release:tag now needs release:verify-deployed, on production
# serving the right version. That inverted the intent: the one case the gate
# exists to catch was also the case that left a stale, merged release branch on
# the remote for a later pipeline to redeploy from (bug-report 016). The same
# coupling also skipped the delete whenever back-merge-develop.sh returned
# early, which is how release/0.8.3 kept its branch.
release:cleanup-branch:
  stage: deploy
  timeout: 10m
  interruptible: false
  needs: []
  retry: !reference [.infra_retry, retry]
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - ./scripts/ci/delete-merged-release-branch.sh

release:back-merge-develop:
  stage: deploy
  timeout: 10m
  interruptible: false
  retry: !reference [.infra_retry, retry]
  needs:
    - release:tag
  rules:
    - !reference [.dedicated_schedule_guard, rules]
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - ./scripts/ci/back-merge-develop.sh
