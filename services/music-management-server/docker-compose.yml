# Every service logs through json-file with rotation. Docker's default is
# json-file *without* a size cap, so a chatty container grows its log under
# /var/lib/docker until the disk is full -- and on the production host a full
# disk has already looked like an unrelated 502 (nginx logs just stop). 3 x 10 MB
# per container is plenty for `docker logs`; the event log is the real history.
# Same values as docker/docker-compose.yml; tests/ci/test_compose_log_rotation.py
# checks that every service in every compose file has a logging block.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# LMS and its nginx front log one line per HTTP request at the configured "info"
# level (Wt's access log on stdout, nginx's access log on stdout): every
# Subsonic call, every stream range request, every cover art fetch -- where a
# worker logs a line per track. With the default 3 x 10 MB the history behind
# `docker logs lms` would be the shortest of any container, while LMS is the one
# most often read after an incident. 5 x 20 MB gives it more room at a bounded
# worst case of 100 MB per container.
x-request-logging: &request-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  lms:
    logging: *request-logging
    container_name: lms
    image: ${IMAGE_NAME}:${LMS_TAG}
    # Hardening (issue #32; the operator's runbook, "Container hardening"). The
    # image has no entrypoint script -- /usr/bin/lms is PID 1 -- and writes only
    # to its working directory /var/lms (a volume), so the root filesystem is
    # read-only with a small /tmp for anything a library spools; SQLite's own
    # temp store is already in memory (PRAGMA temp_store=MEMORY). It runs as
    # root here (`user: "0:0"`, because the host's /docker/lms is root-owned),
    # so it keeps root's file capabilities and nothing else; it binds 5082,
    # never a privileged port. The same settings run in docker/compose.test.yml,
    # which is what the e2e and contract suites exercise. 40 PIDs on production.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
    read_only: true
    tmpfs:
      - /tmp:size=64m
    pids_limit: 1024
    expose:
      - "5082"
    ports:
      # Direct root passthrough, used for lms.<domain> (OpenSubsonic API + legacy Wt UI).
      # Port 80 is intentionally NOT bound here anymore: it is now served by the
      # "reverse-proxy" service below, which rewrites requests to /spotify so that
      # spotify.<domain> serves the actual frontend at "/" instead of LMS's bare
      # Wt bootstrap page. See the operator's runbook.
      - "${LMS_SUBSONIC_PORT:-8080}:5082"
    volumes:
      - ${MUSIC_PATH:-/music}:/music
      - ${DOCKER_DATA_PATH:-/docker}/lms/usr/local/etc:/usr/local/etc
      - ${DOCKER_DATA_PATH:-/docker}/lms/var/lms:/var/lms
    environment:
      - LMS_API_KEY=${LMS_API_KEY}
      - LMS_SUBSONIC_API_KEY=${LMS_SUBSONIC_API_KEY}
      - LMS_MUSIC_MANAGEMENT_URL=${MUSIC_MANAGEMENT_URL}
      - LMS_MUSIC_MANAGEMENT_API_KEY=${MUSIC_MANAGEMENT_API_KEY}
      # music-manager's portrait folder (its STORAGE_PATH) as seen through LMS's /music mount.
      # An artist pointing at a portrait there keeps it on every scan (bug report 139).
      # tests/ci/test_managed_portrait_directory.py keeps the two in step.
      - LMS_ARTIST_IMAGE_MANAGED_DIRECTORY=${LMS_ARTIST_IMAGE_MANAGED_DIRECTORY:-/music/artists}
    networks:
      - default
      - music-management_db
    user: "0:0"
    restart: unless-stopped
    # Measured 549 MiB on production (docker stats, 2026-09-25), outside a scan.
    # A scan or a library rebuild is the peak: the scanner reads tags for the whole
    # library and holds SQLite's page cache on top of the Wt request threads. 1.5g
    # (1536m) is close to three times the resting figure on a host with 8 GB RAM shared
    # with MariaDB and music-manager. An OOM kill shows up as a restart the
    # post-deploy check reports; raise LMS_MEM_LIMIT in the stack's .env then.
    mem_limit: ${LMS_MEM_LIMIT:-1536m}
    labels:
      # Never updated by Watchtower: LMS changes only through a deploy (issue #68).
      com.centurylinklabs.watchtower.enable: "false"
      # Watched by the "autoheal" service below.
      autoheal: "true"
    # Asks LMS a question over its own HTTP port and only cares that it answers
    # at all -- the point is not what LMS says but whether it still has a thread
    # free to say anything. getOpenSubsonicExtensions is the one Subsonic call that
    # needs no credentials, so it answers 200 without writing a line to the log;
    # the credential-less /rest/ping.view used before logged an ERROR ("Required
    # parameter 'c' is missing") every 30 seconds, 2,880 a day. When its HTTP
    # threads were all parked waiting on MuMa, the process stayed up, kept its
    # port open, and answered nothing; that is precisely the state this catches.
    #
    # -S prints the status line to stderr, so grepping for it distinguishes "LMS
    # replied" (whatever the status) from "wget gave up after 4 seconds".
    healthcheck:
      test: ["CMD-SHELL", "wget -S -q -O /dev/null -T 4 'http://127.0.0.1:5082/rest/getOpenSubsonicExtensions.view?c=healthcheck&v=1.16.1&f=json' 2>&1 | grep -q 'HTTP/1'"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

  # A healthcheck on its own only marks a container unhealthy; nothing acts on
  # it. This watches for that and restarts the container, so a wedged LMS comes
  # back on its own instead of waiting for someone to notice the site is down.
  #
  # This became safe to do only once Subsonic auth tokens survived a restart
  # (database migration 116). Before that, restarting LMS silently invalidated
  # every provisioned API key, so an automatic restart would have traded an
  # outage for every client -- muma-radio, muma-mobile -- quietly losing its
  # credentials.
  #
  # It needs the Docker socket to restart a container, which is effectively root
  # on this host. Read-only limits it to no worse than the daemon's own API.
  #
  # Pinned by digest. The image has published no version tag since 1.2.0 (2021)
  # while :latest keeps being rebuilt, so the tag stays "latest" and the digest is
  # the pin; Renovate moves the digest (renovate.json).
  autoheal:
    logging: *default-logging
    container_name: lms-autoheal
    labels:
      # Never updated by Watchtower: pinned by digest, changes only through a deploy (issue #68).
      com.centurylinklabs.watchtower.enable: "false"
    image: willfarrell/autoheal:latest@sha256:7c9c34206a6c30dbc67a2d4f9b54adf0aec32348cf18c7e25f34452a56eea94e
    # A shell loop that talks to the Docker socket with curl: no capability
    # needed (the socket is root's own file), nothing written. 2 PIDs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m
    pids_limit: 64
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    restart: unless-stopped
    # Measured 8.7 MiB (2026-09-25): a shell loop polling the Docker API.
    mem_limit: 128m

  # Serves spotify.<domain> at "/" by rewriting requests to LMS's "/spotify"
  # docroot mount, since Wt's WServer already reserves the deploy-path "/" for
  # its own WApplication routing and cannot serve the frontend there directly
  # (see main.cpp SpotifyResource fallback). See the operator's runbook.
  reverse-proxy:
    logging: *request-logging
    container_name: lms-reverse-proxy
    labels:
      # Never updated by Watchtower: pinned by digest, changes only through a deploy (issue #68).
      com.centurylinklabs.watchtower.enable: "false"
    image: nginx:1.31.8-alpine@sha256:a46f57e097e8effc26192437d2e715adf74bcbea836117651ee436c27983fa41
    # nginx's master runs as root, binds :80 (NET_BIND_SERVICE), creates its
    # temp directories for the nginx user (CHOWN), starts workers as that user
    # (SETUID, SETGID) and signals them on reload/stop (KILL). Read-only root:
    # the pid file goes to a tmpfs /var/run, and /var/cache/nginx -- where the
    # proxy spools a response a slow client has not taken yet, a whole audio
    # file at worst -- is an anonymous volume on disk rather than a tmpfs that
    # would count against the 128m memory limit. 9 PIDs on production.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/run:size=1m
      - /tmp:size=8m
    pids_limit: 256
    ports:
      - "${LMS_PORT:-80}:80"
    volumes:
      - ${DOCKER_DATA_PATH:-/docker}/lms/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/cache/nginx
    depends_on:
      - lms
    # music-management_db is where "music-manager" resolves: the proxy hands
    # /muma/api/ to MuMa directly (see nginx/reverse-proxy.conf), so it needs
    # the same network LMS uses to reach it.
    networks:
      - default
      - music-management_db
    restart: unless-stopped
    # Measured 7.6 MiB (2026-09-25): nginx proxying, no caching. 128m.
    mem_limit: 128m
# NOTE: the "lms_alpha" service (previously used for testing an unstable/alpha
# LMS build alongside the stable one) has been removed as part of the
# production-lms-consolidation plan: production now runs a single LMS
# instance (serving both the OpenSubsonic API and the frontend from its
# docroot) on ${LMS_SUBSONIC_PORT:-8080}, fronted by "reverse-proxy" on
# ${LMS_PORT:-80} for the frontend. See the operator's runbook for the rollback
# procedure and .junie/plans/production-lms-consolidation.md for context.

networks:
  music-management_db:
    external: true
    name: music-management_db
