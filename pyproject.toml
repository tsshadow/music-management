# Tool configuration only: this repository is not packaged/installed, it is run
# from source (see docker/Dockerfile.*), so there is deliberately no [project]
# or [build-system] table here.
#
# pytest is configured in pytest.ini, pylint in .pylintrc.

[tool.ruff]
line-length = 120
# The lowest Python this tree has to *parse* on, which is not the images' 3.14:
# the developer workstation runs the suite natively through the pre-commit hook
# on 3.13, and scripts/prod/install-muma-mcp.sh builds tools/muma_mcp's venv
# from that same python3. "py314" would have ruff format rewrite
# `except (A, B):` into PEP 758's `except A, B:`, a SyntaxError on 3.13. It was
# "py311" -- the CI LXC's system Python -- which stopped mattering once the
# backend jobs moved into the 3.14 tooling container. Type checking follows the
# images instead: see python_version under [tool.mypy].
target-version = "py313"
extend-exclude = [
    ".venv",
    "node_modules",
    "services/music-management-server",   # C++ fork, vendored
    "services/muma-mobile",                # Android/Kotlin
    "services/frontend",                  # handled by oxlint/eslint
]

[tool.ruff.lint]
select = [
    "F",    # pyflakes: real bugs (unused/undefined names)
    "E4",   # pycodestyle: import formatting
    "E7",   # pycodestyle: statement-level mistakes
    "E9",   # pycodestyle: syntax/IO errors
    "I",    # isort: import ordering
    "UP",   # pyupgrade: modern syntax for the target version
    "B",    # flake8-bugbear: likely bugs
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    # FastAPI's whole dependency-injection API is `param: T = Depends(...)`,
    # which is exactly what B008 flags. Not fixable without leaving FastAPI.
    "B008",
    # Bare `except Exception` is the deliberate house style for the batch
    # workers: one unreadable file must never abort a library-wide run.
    "BLE001",
    # The deployment contract uses lowercase environment variables
    # (import_folder_path, music_folder_path, delimiter, ...) and .env matches
    # them; renaming would break every existing deployment.
    "SIM112",
]

[tool.ruff.lint.per-file-ignores]
# Test bootstraps must install their module stubs into sys.modules *before*
# importing the code under test, so imports genuinely cannot come first.
# SIM117: a test that patches four things reads better as nested `with` blocks
# than as one context manager spanning four wrapped lines.
# F811: a pytest test takes its fixtures as parameters, which shadows the
# fixture functions of the same name -- that is the API, not a redefinition.
"tests/**/*.py" = ["E402", "F811", "SIM117"]
"**/*Test.py" = ["E402", "SIM117"]
"**/test_*.py" = ["E402", "SIM117"]
"services/tests/mock_base.py" = ["E402"]
"services/conftest.py" = ["E402", "F401"]
# Entry points wire sys.path before importing project modules.
"services/music_manager/artist_image_fetcher/cli.py" = ["E402"]
"tools/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["services", "tools"]

[tool.ruff.format]
# Enforced by scripts/lint.sh since the whole-tree reformat. Was deferred while
# a repo-wide rewrite would have conflicted with every open branch.
quote-style = "preserve"

[tool.mypy]
# The images' Python (docker/Dockerfile.*), which CI now also runs the suite on.
# Deliberately newer than [tool.ruff] target-version, which is about syntax.
python_version = "3.14"
# Rolled out per module: the settings below are the floor for the whole tree,
# and the [[tool.mypy.overrides]] blocks tighten it where the code is ready.
# Tighten one module at a time; never loosen the floor.
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = [
    '^\.venv/',
    '^services/music-management-server/',
    '^services/muma-mobile/',
    '^services/frontend/',
    # Deprecated, see services/ml-analyzer/DEPRECATED.md. Never type-checked;
    # adding it is on the revive checklist there.
    '^services/ml-analyzer/',
]

[[tool.mypy.overrides]]
# Already type-checked strictly. Extend this list as modules are cleaned up.
module = [
    "services.common.config_store",
    # New code (bug report 087), so it starts strict.
    "services.common.import_queue",
    "services.tagger.todo_label_repair",
    "services.importer.catid_prefix_repair",
    "services.common.step",
    "services.common.version_helper",
    "services.common.Helpers.ArtistNameAnalyzer",
    "services.common.Helpers.FestivalHelper",
    "services.common.Helpers.PodcastHelper",
    "services.common.Helpers.FilterTableHelper",
    "services.common.Helpers.GenreRulesHelper",
    "services.common.Helpers.LookupTableHelper",
    "services.common.Helpers.TableHelper",
    "services.downloader.account_schedule",
    "services.downloader.rate_state",
    "services.importer.extractor",
    "services.importer.renamer",
    "services.music_manager.rbac",
    # New code, so it starts here (see tools.muma_mcp below for the same rule).
    "services.music_manager.feeds.*",
    "services.music_manager.artist_image_fetcher.matcher",
    "services.music_manager.artist_image_fetcher.normalizer",
    "services.music_manager.artist_image_fetcher.storage",
    "services.music_manager.artist_image_fetcher.providers.base",
    "services.music_manager.catalog_series",
    # New code (bug report 042), so it starts strict.
    "services.music_manager.track_relink",
    # New code (bug report 104), so it starts strict.
    "services.music_manager.orphan_purge",
    # New code (bug report 129), so it starts strict.
    "services.music_manager.lms_writes",
    "services.tagger.constants",
    "services.tagger.Song.rules.TagResult",
    "services.tagger.Song.rules.TagRule",
    # New code, so it starts here rather than being cleaned up later. __main__ is
    # deliberately absent: it is the only module that imports the MCP SDK, whose
    # decorators mypy cannot follow without the package installed.
    # New code (bug report 068), so it starts strict.
    "tools.apply_migrations",
    "tools.muma_mcp.api",
    "tools.muma_mcp.config",
    "tools.muma_mcp.db",
    "tools.muma_mcp.guard",
    "tools.muma_mcp.redact",
]
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = true

[tool.coverage.run]
# What scripts/test/music-management-unit.sh measures: the shipped Python under services/
# and tools/, and nothing that only exists to test it. Before this table the run used
# --cov=services with no omit list, so the ~220 test and fixture files under services/
# (more lines than the code they test, all executed by definition) were counted as
# covered source and lifted the figure by several points, while tools/ -- whose tests
# do run -- was not measured at all.
source = ["services", "tools"]
omit = [
    "*Test.py",
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "services/tests/mock_base.py",
    # Deprecated and disabled, its tests out of the default run (services/ml-analyzer/
    # DEPRECATED.md). Counted, it would read as ~0% covered code nobody runs.
    "services/ml-analyzer/*",
]
