  importer_worker:
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_IMPORTER}:${IMAGE_TAG:-latest}
    container_name: muma-importer-worker
    logging: *default-logging
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    # Conservative ceiling (yt-dlp + ffmpeg post-processing is the peak);
    # override with MUMA_MEM_LIMIT_IMPORTER. See the note on music-manager.
    mem_limit: ${MUMA_MEM_LIMIT_IMPORTER:-2g}
    depends_on:
      - db
    command:
      [
        "python",
        "services/importer/importer_service.py",
        "--repeat",
        "--sleeptime",
        "300"
      ]
    environment:
      <<: [*environment-db, *environment-paths, *environment-lms]
      NOTIFY_URL: ${NOTIFY_URL}
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "False"
      rescan: "True"
      delimiter: "${delimiter}"
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db

  youtube_worker:
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_DOWNLOADER}:${IMAGE_TAG:-latest}
    container_name: muma-youtube-worker
    logging: *default-logging
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    # Conservative ceiling (yt-dlp + ffmpeg post-processing is the peak);
    # override with MUMA_MEM_LIMIT_DOWNLOADER. See the note on music-manager.
    mem_limit: ${MUMA_MEM_LIMIT_DOWNLOADER:-2g}
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "youtube",
        "--repeat",
        "--break-on-existing"
      ]
    environment:
      <<: [*environment-db, *environment-downloader, *environment-paths, *environment-lms]
      NOTIFY_URL: ${NOTIFY_URL}
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "False"
      rescan: "True"
      delimiter: "${delimiter}"
      YT_COOKIES: "firefox:/firefox-config/profile"
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
      - ${HOST_DATA_PATH}/firefox:/firefox-config:ro
    networks:
      - music-management_db

  soundcloud_worker:
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_DOWNLOADER}:${IMAGE_TAG:-latest}
    container_name: muma-soundcloud-worker
    logging: *default-logging
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    # Conservative ceiling (yt-dlp + ffmpeg post-processing is the peak);
    # override with MUMA_MEM_LIMIT_DOWNLOADER. See the note on music-manager.
    mem_limit: ${MUMA_MEM_LIMIT_DOWNLOADER:-2g}
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "soundcloud",
        "--repeat",
        "--break-on-existing"
      ]
    environment:
      <<: [*environment-db, *environment-downloader, *environment-paths, *environment-lms]
      NOTIFY_URL: ${NOTIFY_URL}
      PYTHONPATH: /app
      debug: "${debug}"
      dryrun: "False"
      rescan: "True"
      delimiter: "${delimiter}"
      soundcloud_cookies: "firefox:/firefox-config/profile"
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
      - ${HOST_DATA_PATH}/firefox:/firefox-config:ro
    networks:
      - music-management_db

  telegram_worker:
    security_opt:
      - no-new-privileges:true
    image: ${DOCKER_USER}/${IMAGE_TELEGRAM}:${IMAGE_TAG:-latest}
    container_name: muma-telegram-worker
    logging: *default-logging
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    # Conservative ceiling (yt-dlp + ffmpeg post-processing is the peak);
    # override with MUMA_MEM_LIMIT_TELEGRAM. See the note on music-manager.
    mem_limit: ${MUMA_MEM_LIMIT_TELEGRAM:-1g}
    depends_on:
      - db
    command:
      [
        "python",
        "services/downloader/downloader_service.py",
        "--step",
        "telegram",
        "--repeat",
      ]
    environment:
      <<: [*environment-db, *environment-telegram, *environment-paths, *environment-lms]
      NOTIFY_URL: ${NOTIFY_URL}
      PYTHONPATH: /app
      debug: "${debug}"
      delimiter: "${delimiter}"
      music_folder_path: ${music_folder_path}
    volumes:
      - ${HOST_DATA_PATH}/importer:/app/data
      - ${HOST_MUSIC_PATH}:/mnt/music
      - ${HOST_DATA_PATH}/shared:/shared
    networks:
      - music-management_db
    stdin_open: true
    tty: true

