# Rewrites requests arriving on the frontend host port (see LMS_PORT in
# docker-compose.yml, mapped to spotify.<domain> in the reverse proxy) to
# LMS's "/spotify" docroot mount, so the built frontend is served at "/"
# instead of LMS's bare Wt bootstrap page.
#
# Background: Wt's WServer reserves deploy-path "/" for its own WApplication
# routing, so LMS's SpotifyResource can never register directly on "/" and
# falls back to "/spotify" (see services/music-management-server/src/lms/main.cpp).
# This proxy hides that implementation detail from the outside world.
#
# IMPORTANT: the frontend (see services/frontend/src/lib/AuthOverlay.svelte and
# store.js) calls the Subsonic API and the muma bridge using *root-relative*
# paths ("/rest/...", "/muma/...") in production. Those two API namespaces are
# registered by LMS directly on "/rest" and "/muma" (see main.cpp), NOT under
# "/spotify", so they must be proxied through unchanged. Without these two
# location blocks, every "/rest/*" and "/muma/*" call falls through to the
# catch-all below, gets rewritten to "/spotify/rest/*" / "/spotify/muma/*",
# and LMS's SPA fallback silently returns index.html instead of a JSON
# response -- breaking login, streaming, ratings, and anything else that
# talks to the API (this broke login on spotify.<domain> after the "/" fix).
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS server. Without a "resolver" directive, nginx
    # resolves plain-hostname proxy_pass targets (like "lms" below) exactly
    # once at startup and caches that IP forever. When the "lms" container
    # is recreated/restarted (redeploy, watchtower update, crash-restart) it
    # gets a *new* internal IP, but this proxy keeps hammering the old one,
    # which the kernel now refuses -- every request then fails with a 502
    # "Connection refused" until this proxy is itself restarted. Combining
    # this resolver with a variable in proxy_pass (below) makes nginx
    # re-resolve "lms" on each new upstream connection instead.
    resolver 127.0.0.11 valid=10s;

    # Google Identity Services' Sign-In popup communicates back to this page
    # via window.postMessage(). The strict default "Cross-Origin-Opener-Policy:
    # same-origin" (or simply not opting in) can make some browsers sever the
    # window reference to that popup, breaking the token hand-off (observed in
    # the browser console as "Cross-Origin-Opener-Policy policy would block
    # the window.postMessage call."). "same-origin-allow-popups" keeps the
    # isolation benefits for same-origin windows while explicitly allowing a
    # trusted cross-origin popup (accounts.google.com) to keep talking back to
    # this origin -- see AuthOverlay.svelte's Google Sign-In integration.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location /rest {
        set $lms_upstream lms;
        proxy_pass http://$lms_upstream:5082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The muma routes LMS itself implements stay with LMS. Each of these either
    # reads LMS's own database (library admin, the native artist id lookup,
    # the track id -> path resolution behind /refresh, the per-user settings
    # under /muma/users/) or accepts Subsonic credentials (the artist image the
    # player asks for with u= and p=).
    # A regex location wins over the prefix location below, so this list is
    # what keeps those paths on LMS; everything else under /muma/api/ is a
    # plain pass-through that LMS used to forward one call at a time.
    #
    # /muma/api/auth/login is deliberately NOT on this list. LMS used to answer
    # it itself with its own configured api-key -- one value for every user,
    # and on production possibly MuMa's system key. MuMa's own login answers
    # with the user's own key, permissions and refresh token.
    location ~ ^/muma/(api/admin/|api/artists/[^/]+/image$|api/artists/(?:[^/-]*-)?[0-9]+$|api/tracks/.+/refresh$|users/) {
        set $lms_upstream lms;
        proxy_pass http://$lms_upstream:5082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Every other /muma/api/ call goes straight to MuMa. It used to pass
    # through LMS's MumaResource, which parks one Wt http thread per call,
    # sends them to MuMa one at a time, and refuses anything past half its
    # thread pool with a 503 -- four calls on production's eight cores, fewer
    # than the home screen alone asks for. MuMa checks X-API-Key itself, so
    # LMS added nothing here but the bottleneck.
    #
    # The rewrite works on the decoded $uri and nginx encodes the result once
    # on the way out, so "Silky%20Noize" arrives as "Silky%20Noize". Do not be
    # tempted to build the upstream URI from $request_uri (via a rewrite or a
    # variable in proxy_pass) to keep it byte-for-byte: nginx escapes that a
    # second time, and MuMa then sees "%2520" and a "%3F" where the query
    # string started. Nothing is lost by decoding: uvicorn unquotes the whole
    # path before FastAPI routes it, so a "%2F" inside a name was never
    # distinguishable from "/" on MuMa's side, whichever proxy sent it.
    #
    # MuMa's login rate limit (services/music_manager/rate_limit.py) keys on the
    # left-most X-Forwarded-For entry, and the login itself now arrives here. A
    # client could otherwise put any address it likes in front of the chain and
    # start a fresh bucket with every guess. So the client address is taken
    # from the forwarded chain only as far as it was written by a proxy on a
    # private network (Nginx Proxy Manager on the LAN, a Docker bridge), and
    # MuMa receives that one address instead of the whole chain. Scoped to
    # this location: LMS's own view of the client is left exactly as it was.
    location /muma/api/ {
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        set $muma_upstream music-manager;
        rewrite ^/muma(/.*)$ $1 break;
        proxy_pass http://$muma_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The news bulletin is a 15 MB MP3; no point holding it in memory.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /muma {
        set $lms_upstream lms;
        proxy_pass http://$lms_upstream:5082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $lms_upstream lms;
        rewrite ^/(.*) /spotify/$1 break;
        proxy_pass http://$lms_upstream:5082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
